<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>River and Almanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<style>
:root {
  --void: #040507;
  --edge: rgb(255 255 255 / 0.075);
  --edge-strong: rgb(255 255 255 / 0.14);
  --text: #e9e5da;
  --muted: #8d949d;
  --faint: #5c636c;
  --accent: #d6ab4c;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --crack: #7fc7d9;
  --obsidian: rgb(7 8 11 / 0.96);
  --well: rgb(0 0 0 / 0.45);
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-brush: 'Ma Shan Zheng', 'KaiTi', serif;
  --font-ui: Inter, system-ui, 'Segoe UI', sans-serif;
  --radius: 9px;

  --k-qi: #7fc7d9;  --k-body: #c98a5f;  --k-soul: #a28fdc;  --k-gate: #c4a3f0;
  --k-mastery: #cf7f9f;  --k-learn: #a9b97f;  --k-fight: #ee9670;  --k-hurt: #e08a6a;
  --k-people: #86d19a;  --k-card: #b9b3a6;  --k-settled: #6b727b;  --k-origin: #e4e7ee;
  --k-death: #9aa0a8;  --k-system: #8d949d;  --k-realm: #8fd3b8;

  --s-spring: #86d19a; --s-summer: #e8a874; --s-autumn: #dcb359; --s-winter: #7fc7d9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--void); color: var(--text); font: 14px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font: inherit; color: inherit; }
select { font: inherit; color: var(--text); background: #0b0d11; border: 1px solid var(--edge-strong); border-radius: 7px; padding: 4px 8px; }

/* ---------- study chrome ---------- */
.study-bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 20px; background: rgb(4 5 7 / 0.94); border-bottom: 1px solid var(--edge); backdrop-filter: blur(6px);
}
.study-bar h1 { font: 600 19px var(--font-display); margin: 0 6px 0 0; white-space: nowrap; }
.study-bar h1 small { font: 15px var(--font-brush); color: var(--accent); margin-left: 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { background: none; border: 1px solid var(--edge); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13px; }
.tab[aria-selected="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.knobs { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; color: var(--muted); margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--edge-strong); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.seg button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.study-note { max-width: 1360px; margin: 12px auto 0; padding: 0 20px; color: var(--muted); font-size: 13px; }
.study-note b { color: var(--text); font-weight: 500; }

/* ---------- shell ---------- */
.shell {
  display: grid; grid-template-columns: 180px minmax(0, 1fr) 230px;
  max-width: 1360px; margin: 12px auto 60px; min-height: 760px;
  border: 1px solid var(--edge); border-radius: 12px; overflow: clip; position: relative;
  background: radial-gradient(900px 500px at 70% 110%, rgb(127 199 217 / 0.05), transparent 60%), var(--void);
}
.menu { padding: 18px 10px; border-right: 1px solid var(--edge); background: rgb(4 5 7 / .7); }
.menu .brand { font: 600 16px var(--font-display); padding: 0 8px 14px; white-space: nowrap; }
.menu .brand span { font: 14px var(--font-brush); color: var(--accent); margin-left: 4px; }
.menu a { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 13.5px; margin-bottom: 2px; }
.menu a span { font-family: var(--font-brush); opacity: .7; }
.menu a.on { color: var(--text); background: rgb(255 255 255 / .04); box-shadow: inset 2px 0 0 var(--accent); }
.main { padding: 22px 24px; min-width: 0; }
.main > h2 { font: 600 30px var(--font-display); margin: 0 0 14px; }
.main > h2 span { font: 22px var(--font-brush); color: var(--accent); margin-left: 8px; }
.context { border-left: 1px solid var(--edge); padding: 22px 16px; background: rgb(4 5 7 / .55); font-size: 12.5px; }
.context h3 { font: 600 18px var(--font-display); margin: 0 0 10px; }
.context .ln { display: flex; gap: 7px; margin-bottom: 9px; }
.panel { background: var(--obsidian); border: 1px solid var(--edge-strong); border-radius: var(--radius); box-shadow: 0 0 0 1px rgb(127 199 217 / .06), 0 0 24px rgb(127 199 217 / .05); padding: 18px 20px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.panel-head h3 { font: 600 21px var(--font-display); margin: 0; }
.head-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.caption { color: var(--muted); font-size: 12.5px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.linkish:hover { text-decoration: underline; }

.glyph {
  display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 5px;
  font: 14px/1 var(--font-brush); color: var(--kc);
  border: 1px solid color-mix(in srgb, var(--kc) 40%, transparent);
  background: color-mix(in srgb, var(--kc) 9%, transparent);
}
.glyph.sm { width: 18px; height: 18px; font-size: 12px; border-radius: 4px; }
.glyph.dim { opacity: .55; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--edge-strong); border-radius: 999px; padding: 2px 9px 2px 3px; cursor: pointer; font-size: 12px; color: var(--muted); }
.chip .glyph { width: 18px; height: 18px; font-size: 12px; border-radius: 999px; }
.chip[aria-pressed="false"] { opacity: .38; }
.chip[aria-pressed="true"] { color: var(--text); }

/* ---------- the river ---------- */
.river-legend { display: grid; grid-template-columns: 1fr 64px 1fr; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.river-legend :first-child { text-align: right; }
.rrow { display: grid; grid-template-columns: 1fr 64px 1fr; min-height: 26px; scroll-margin: 140px; }
.rrow .l { text-align: right; padding: 3px 14px 3px 0; }
.rrow .r { padding: 3px 0 3px 14px; }
.rrow .c { position: relative; display: flex; justify-content: center; }
.rrow .c::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: var(--w, 2px); transform: translateX(-50%);
  background: var(--tint, var(--crack)); box-shadow: 0 0 calc(var(--w, 2px) * 3) color-mix(in srgb, var(--tint, var(--crack)) 50%, transparent); border-radius: 2px;
}
.ryear .l { align-self: center; font: 600 17px var(--font-display); }
.ryear .r { align-self: center; color: var(--muted); font-size: 12px; }
.ryear .age {
  position: relative; z-index: 1; align-self: center; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font: 600 15px var(--font-display); background: #090b0f; border: 1px solid var(--edge-strong); box-shadow: 0 0 0 4px var(--void);
}
.sdot { position: relative; z-index: 1; margin-top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 3px var(--void); }
.rline { display: flex; gap: 8px; align-items: flex-start; margin: 2px 0; }
.rrow .l .rline { flex-direction: row-reverse; }
.rline.big { font: 600 16.5px/1.35 var(--font-display); }
.rline.big .glyph { width: 28px; height: 28px; font-size: 18px; }
.rline.settled { color: var(--faint); font-size: 12.5px; }
.sname { font-size: 10.5px; color: var(--sc); text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.settled-count { color: var(--faint); font-size: 12px; margin-top: 2px; }
.rfold .c::before { background: repeating-linear-gradient(var(--tint, var(--crack)) 0 4px, transparent 4px 9px); box-shadow: none; opacity: .6; }
.rfold .l, .rfold .r { padding-top: 16px; padding-bottom: 16px; }
.rfold .l .yrs { font: italic 600 16px var(--font-display); color: var(--muted); }
.rfold .seals { display: flex; gap: 3px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.rfold .r .sum { font: italic 15px var(--font-display); color: var(--muted); }
.rrealm { min-height: 76px; }
.rrealm .c::before { background: linear-gradient(var(--k-realm), var(--crack)); }
.rrealm .seal {
  position: relative; z-index: 1; align-self: center; width: 54px; height: 54px; border-radius: 10px; display: grid; place-items: center;
  font: 20px/1 var(--font-brush); color: var(--k-realm); background: #08100e; border: 1px solid var(--k-realm);
  box-shadow: 0 0 0 5px var(--void), 0 0 22px rgb(143 211 184 / .45);
}
.rrealm .l { align-self: center; font: 600 18px/1.3 var(--font-display); }
.rrealm .r { align-self: center; }
.rrealm .r b { display: block; font: 600 18px var(--font-display); color: var(--k-realm); }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@keyframes flash { 0%, 30% { background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); } 100% { background: transparent; box-shadow: none; } }
.unfold-top { text-align: center; margin: 2px 0 6px; }

/* ---------- the almanac ---------- */
.alm-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
.almanac { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
.almanac th { font: 500 11px var(--font-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.almanac th .brush { font: 16px var(--font-brush); display: block; text-transform: none; letter-spacing: 0; color: var(--sc); }
.almanac .yr { width: 64px; text-align: right; padding-right: 6px; font: 600 16px var(--font-display); }
.almanac .end { width: 150px; color: var(--muted); font-size: 11.5px; line-height: 1.3; padding-left: 6px; }
.almanac tr { scroll-margin: 140px; }
.cell { height: 52px; vertical-align: top; padding: 4px; border-radius: 6px; cursor: pointer; background: color-mix(in srgb, var(--sc) 4%, rgb(255 255 255 / .015)); border: 1px solid var(--edge); }
.cell:hover { border-color: var(--edge-strong); }
.cell.sel { border-color: var(--accent); background: var(--accent-soft); }
.cell.rise { box-shadow: inset 0 0 0 1px rgb(127 199 217 / .45), 0 0 12px rgb(127 199 217 / .16); }
.cell.realm { box-shadow: inset 0 0 0 2px var(--k-realm), 0 0 16px rgb(143 211 184 / .35); }
.cell .pips { display: flex; flex-wrap: wrap; gap: 3px; }
.cell .more { color: var(--faint); font-size: 11px; }
.afold td.span { cursor: pointer; border: 1px dashed var(--edge-strong); border-radius: 6px; padding: 8px 10px; color: var(--muted); }
.afold td.span:hover { border-color: var(--muted); }
.afold .t { font: italic 600 15px var(--font-display); color: var(--text); margin-right: 8px; }
.afold .seals { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 6px; }
.readout { position: sticky; top: 76px; }
.readout h4 { font: 600 19px var(--font-display); margin: 0 0 2px; }
.readout .ln { display: flex; gap: 8px; margin: 8px 0; align-items: flex-start; }
.readout .after { color: var(--muted); font-size: 12px; border-top: 1px solid var(--edge); padding-top: 8px; margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.expand-row > td { padding: 6px 0 14px; }
.expand-row .inner { border: 1px solid var(--edge); border-radius: 8px; padding: 10px 6px; background: rgb(127 199 217 / .02); }
.yr-click { cursor: pointer; }
.yr-click:hover { color: var(--accent); }
.yr-click .caret { font: 11px var(--font-ui); color: var(--muted); margin-left: 3px; }

/* ---------- mini almanacs ---------- */
.sq { width: 13px; height: 13px; border-radius: 3px; background: rgb(255 255 255 / .045); cursor: pointer; }
.sq.on { background: color-mix(in srgb, var(--kc) 70%, transparent); }
.sq.settledonly { background: rgb(255 255 255 / .1); }
.sq.realm { background: var(--k-realm); box-shadow: 0 0 8px var(--k-realm); }
.sq.here { outline: 1px solid var(--accent); outline-offset: 1px; }
.strip-wrap { position: sticky; top: 56px; z-index: 5; background: var(--obsidian); padding: 8px 0 10px; margin: 0 0 12px; border-bottom: 1px solid var(--edge); }
.strip { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; align-items: flex-start; }
.strip .col { display: grid; grid-template-rows: repeat(4, 13px) 14px; gap: 2px; justify-items: center; }
.strip .col .lab { font-size: 9.5px; color: var(--muted); }
.strip .fcol { width: 22px; height: 58px; border: 1px dashed var(--edge-strong); border-radius: 3px; display: grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 9px; writing-mode: vertical-rl; }
.strip .fcol:hover { border-color: var(--muted); }
.strip .sdots { display: grid; grid-template-rows: repeat(4, 13px); gap: 2px; font: 11px/13px var(--font-brush); padding-right: 4px; }
.strip-key { display: flex; gap: 12px; color: var(--muted); font-size: 11.5px; margin-top: 4px; flex-wrap: wrap; }

.dock-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 16px; align-items: start; }
.dock { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); max-height: calc(100vh - 100px); overflow: auto; }
.dock .drow { display: grid; grid-template-columns: 26px repeat(4, 13px); gap: 3px; align-items: center; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
.dock .drow.inview { background: rgb(255 255 255 / .06); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.dock .dfold { padding: 3px 4px; border: 1px dashed var(--edge-strong); border-radius: 4px; font-style: italic; cursor: pointer; margin: 2px 0; text-align: center; }
.dock .dhead { display: grid; grid-template-columns: 26px repeat(4, 13px); gap: 3px; padding: 0 4px; font: 11px var(--font-brush); }

.yseal { position: relative; z-index: 1; align-self: center; display: grid; grid-template-columns: 17px 17px; gap: 2px; padding: 3px; background: #090b0f; border: 1px solid var(--edge-strong); border-radius: 6px; box-shadow: 0 0 0 4px var(--void); }
.yseal .q { width: 17px; height: 17px; border-radius: 3px; display: grid; place-items: center; font: 11px/1 var(--font-brush); color: var(--kc, var(--faint)); background: color-mix(in srgb, var(--kc, #fff) 14%, transparent); }
.yseal .q.empty { background: rgb(255 255 255 / .03); }
.yseal .q.realm { background: var(--k-realm); color: #08100e; }
.ryear .agel { font: 12px var(--font-ui); color: var(--muted); margin-left: 6px; }

.view { display: none; }
.view.on { display: block; }

/* ---------- phone ---------- */
.phone .shell { grid-template-columns: minmax(0, 1fr); max-width: 390px; border-radius: 18px; }
.phone .menu, .phone .context { display: none; }
.phone .main { padding: 14px 12px; }
.phone .panel { padding: 12px; }
.phone .rrow, .phone .river-legend { grid-template-columns: 1fr 42px 1fr; }
.phone .rrow .l { padding-right: 7px; } .phone .rrow .r { padding-left: 7px; }
.phone .rline { font-size: 12.5px; gap: 5px; }
.phone .rline.big { font-size: 14px; }
.phone .rline.big .glyph { width: 22px; height: 22px; font-size: 14px; }
.phone .ryear .l { font-size: 14px; }
.phone .ryear .age { width: 32px; height: 32px; font-size: 13px; }
.phone .rrealm .seal { width: 40px; height: 40px; font-size: 15px; }
.phone .alm-wrap, .phone .dock-wrap { grid-template-columns: minmax(0, 1fr); }
.phone .almanac .end { display: none; }
.phone .almanac .yr { width: 34px; font-size: 13px; }
.phone .almanac { border-spacing: 2px; }
.phone .cell { height: 46px; padding: 2px; }
.phone .cell .glyph { width: 14px; height: 14px; font-size: 10px; border-radius: 3px; }
.phone .readout { position: static; }
.phone .dock { display: none; }
.phone .yseal { grid-template-columns: 13px 13px; }
.phone .yseal .q { width: 13px; height: 13px; font-size: 9px; }
.phone .tabs .tab { font-size: 12px; }
@media (max-width: 1100px) { .shell { grid-template-columns: 160px minmax(0, 1fr); } .context { display: none; } }
</style>
</head>
<body>

<div class="study-bar">
  <h1>River and Almanac <small>生平</small></h1>
  <div class="tabs" role="tablist">
    <button class="tab" data-variant="toggle">1 · Two views, linked</button>
    <button class="tab" data-variant="strip">2 · Almanac strip over the river</button>
    <button class="tab" data-variant="dock">3 · Almanac docked beside</button>
    <button class="tab" data-variant="unfold">4 · Almanac that opens into the river</button>
    <button class="tab" data-variant="seals">5 · Year seals on the river</button>
  </div>
  <div class="knobs">
    <span>Settled cards</span>
    <div class="seg" id="knob-settled">
      <button data-v="kind">their own kind 了</button>
      <button data-v="count">a count only</button>
    </div>
    <div class="seg" id="knob-size">
      <button data-v="desktop">Desktop</button>
      <button data-v="phone">Phone</button>
    </div>
  </div>
</div>
<div class="study-note" id="note"></div>

<div class="shell">
  <nav class="menu" aria-label="Screens">
    <div class="brand">Severed Heaven<span>断天</span></div>
    <a href="#">Abode <span>洞府</span></a><a href="#">Cultivate <span>修炼</span></a><a href="#">Trees <span>道树</span></a>
    <a href="#">Character <span>根骨</span></a><a href="#">People <span>人物</span></a><a href="#" class="on">Chronicle <span>生平</span></a><a href="#">Settings <span>设置</span></a>
  </nav>
  <main class="main">
    <h2>Chronicle<span>生平</span></h2>
    <section class="panel" id="panel"></section>
  </main>
  <aside class="context" id="context"></aside>
</div>

const LIVES = {
  now: { name: 'Mo Ning', label: 'This life · Mo Ning, 46', rows: MO_NING, now: 46, gap: 'a childhood at the Wall' },

const KIND = {
  qi: ['气', 'Qi'], body: ['体', 'Body'], soul: ['魂', 'Soul'], gate: ['关', 'Gates'], mastery: ['精', 'Mastery'],
  learn: ['学', 'Learned'], fight: ['战', 'Fights'], hurt: ['伤', 'Hurts'], people: ['人', 'People'], card: ['事', 'Choices'],
  settled: ['了', 'Settled itself'], origin: ['生', 'Birth'], death: ['终', 'Death'], system: ['开', 'Openings'],
};
const LEFT = new Set(['qi', 'body', 'soul', 'gate', 'mastery', 'origin', 'death']);
const BIG = LEFT;
const FOLDABLE = new Set(['qi', 'body', 'soul', 'settled']);
const PRIORITY = ['realm', 'death', 'gate', 'qi', 'mastery', 'hurt', 'fight', 'people', 'learn', 'card', 'body', 'soul', 'origin', 'system', 'settled'];
const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
const SEASON_HZ = ['春', '夏', '秋', '冬'];
const NUM_HZ = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const ORD1 = { one: 'first', two: 'second', three: 'third', five: 'fifth', eight: 'eighth', nine: 'ninth', twelve: 'twelfth' };
const words = (n) => n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
const ordinal = (n) => { const w = words(n); const parts = w.split('-'); const last = parts.pop(); const o = ORD1[last] ?? (last.endsWith('y') ? last.slice(0, -1) + 'ieth' : last + 'th'); return [...parts, o].join('-'); };
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const sc = (s) => `--sc:var(--s-${SEASONS[s]})`;
const glyph = (k, cls = '') => `<span class="glyph ${cls}" style="--kc:var(--k-${k})" title="${KIND[k][1]}">${KIND[k][0]}</span>`;
const STAGE = ['early', 'middle', 'late', 'peak'];
const REALMS = [
  { name: 'Qi Condensation', hz: '炼气', tint: 'var(--crack)' },
  { name: 'Foundation Establishment', hz: '筑基', tint: 'var(--k-realm)' },
];
const realmOf = (l) => (l >= 10 ? 1 : 0);
const levelWords = (l) => !l ? 'mortal' : l <= 9 ? `Qi Condensation, ${ordinal(l)} layer` : `Foundation, ${STAGE[l - 10]} stage`;
const spineW = (l) => !l ? 1.5 : l <= 9 ? 2 + 0.7 * l : 2 + 1.6 * (l - 9);

// ===================== state =====================
const S = {
  variant: 'toggle', life: 'now', view: 'river', settled: 'kind', size: 'desktop',
  off: new Set(), unfolded: new Set(), sel: null, open: new Set(),
};
try { Object.assign(S, JSON.parse(localStorage.getItem('river-almanac') || '{}'), { off: new Set(), unfolded: new Set(), open: new Set() }); } catch {}
const save = () => { try { localStorage.setItem('river-almanac', JSON.stringify({ variant: S.variant, settled: S.settled, size: S.size })); } catch {} };

function lifeData() {
  const L = LIVES[S.life];
  const ev = L.rows.map(([y, s, kind, text, lvl], i) => ({ i, y, s, kind, text, lvl, t: (y - 1) * 4 + s, realm: kind === 'qi' && lvl === 10 }));
  const at = (t) => {
    const o = { qi: 0, body: 0, soul: 0 };
    for (const e of ev) if (e.t <= t && e.lvl !== undefined && o[e.kind] !== undefined) o[e.kind] = e.lvl;
    return o;
  };
  // runs of three or more years holding nothing but layers and settled cards fold into one stretch
  const items = [];
  let run = [];
  const flush = () => {
    if (run.length >= 3) items.push({ fold: true, from: run[0], to: run.at(-1) });
    else run.forEach((y) => items.push({ y }));
    run = [];
  };
  for (let y = 1; y <= L.now; y++) {
    const es = ev.filter((e) => e.y === y);
    const quiet = es.every((e) => FOLDABLE.has(e.kind) && !e.realm);
    if (quiet && y !== L.now) run.push(y); else { flush(); items.push({ y }); }
  }
  flush();
  return { L, ev, at, items };
}
const shows = (e) => !S.off.has(e.kind) && !(e.kind === 'settled' && S.settled === 'count');
const strongest = (es) => {
  let best = null, bi = 99;
  for (const e of es) { const k = e.realm ? 'realm' : e.kind; const i = PRIORITY.indexOf(k); if (i < bi) { bi = i; best = k; } }
  return best;
};
const foldOf = (D, y) => D.items.find((it) => it.fold && y >= it.from && y <= it.to);
const isOpenFold = (it) => S.unfolded.has(`${S.life}:${it.from}`);

function foldSummary(D, it) {
  const n = it.to - it.from + 1;
  const es = D.ev.filter((e) => e.y >= it.from && e.y <= it.to);
  const qi = es.filter((e) => e.kind === 'qi').length, bo = es.filter((e) => e.kind === 'body').length, so = es.filter((e) => e.kind === 'soul').length;
  const st = es.filter((e) => e.kind === 'settled').length;
  const parts = [];
  if (qi) parts.push(`${qi === 1 ? 'a step' : `${words(qi)} steps`} of qi`);
  if (bo) parts.push(`${bo === 1 ? 'a body layer' : `${words(bo)} body layers`}`);
  if (so) parts.push(`${so === 1 ? 'a soul layer' : `${words(so)} soul layers`}`);
  const what = parts.length ? parts.join(', ') : (it.from === 2 ? D.L.gap : 'nothing written');
  return { n, es, st, text: `${cap(words(n))} quiet years: ${what}${st ? ` · ${words(st)} settled without you` : ''}` };
}

// ===================== the river =====================
function riverSeasonRows(D, y, opts = {}) {
  let out = '';
  for (let s = 3; s >= 0; s--) {
    const all = D.ev.filter((e) => e.y === y && e.s === s);
    if (!all.length) continue;
    const l = D.at((y - 1) * 4 + s).qi;
    const tint = REALMS[realmOf(l)].tint;
    const realmE = all.find((e) => e.realm);
    const rest = all.filter((e) => !e.realm && shows(e));
    const settledN = S.settled === 'count' && !S.off.has('settled') ? all.filter((e) => e.kind === 'settled').length : 0;
    const left = rest.filter((e) => LEFT.has(e.kind));
    const right = rest.filter((e) => !LEFT.has(e.kind));
    const line = (e) => `<div class="rline ${BIG.has(e.kind) ? 'big' : ''} ${e.kind === 'settled' ? 'settled' : ''}">${glyph(e.kind, e.kind === 'settled' ? 'dim' : '')}<span>${esc(e.text)}</span></div>`;
    if (left.length || right.length || settledN) {
      const sn = `<div class="sname">${SEASONS[s]}</div>`;
      out += `<div class="rrow" id="r-${y}-${s}" style="--w:${spineW(l)}px;--tint:${tint};${sc(s)}">
        <div class="l">${right.length || settledN ? '' : sn}${left.map(line).join('')}</div>
        <div class="c"><span class="sdot"></span></div>
        <div class="r">${right.length || settledN ? sn : ''}${right.map(line).join('')}${settledN ? `<div class="settled-count">+ ${settledN === 1 ? 'one card' : `${words(settledN)} cards`} settled without you</div>` : ''}</div>
      </div>`;
    }
    if (realmE && !S.off.has('qi')) {
      out += `<div class="rrow rrealm" id="${left.length || right.length ? '' : `r-${y}-${s}`}" style="--w:${spineW(9)}px;${sc(s)}">
        <div class="l">${esc(realmE.text)}</div>
        <div class="c"><span class="seal">${REALMS[1].hz}</span></div>
        <div class="r"><b>${REALMS[1].name}</b><span class="caption">The line starts thin again: a new realm, a new river.</span></div>
      </div>`;
    }
  }
  return out;
}
function riverYearRow(D, y, opts = {}) {
  const l = D.at((y - 1) * 4 + 3).qi;
  const tint = REALMS[realmOf(l)].tint;
  let center = `<span class="age">${y}</span>`;
  if (opts.seals) {
    const qs = [0, 1, 2, 3].map((s) => {
      const es = D.ev.filter((e) => e.y === y && e.s === s && (shows(e) || (e.kind === 'settled' && !S.off.has('settled'))));
      const k = strongest(es);
      if (!k) return `<span class="q empty" title="${SEASONS[s]}: nothing"></span>`;
      if (k === 'realm') return `<span class="q realm" title="${SEASONS[s]}">基</span>`;
      return `<span class="q" style="--kc:var(--k-${k})" title="${SEASONS[s]}: ${KIND[k][1]}">${KIND[k][0]}</span>`;
    }).join('');
    center = `<span class="yseal" title="The ${ordinal(y)} year, season by season">${qs}</span>`;
  }
  const link = opts.toAlmanac ? ` · <button class="linkish" data-to-almanac="${y}">in the almanac</button>` : '';
  return `<div class="rrow ryear" id="ry-${y}" style="--w:${spineW(l)}px;--tint:${tint}">
    <div class="l">${cap(ordinal(y))} year${opts.seals ? `<span class="agel">age ${y}</span>` : ''}</div>
    <div class="c">${center}</div>
    <div class="r">${y === 1 ? 'born' : levelWords(l)}${link}</div>
  </div>`;
}
function riverFoldRow(D, it) {
  const f = foldSummary(D, it);
  const l = D.at((it.to - 1) * 4 + 3).qi;
  const seals = f.es.filter((e) => e.kind !== 'settled' && shows(e)).map((e) => `<span title="${esc(e.text)}">${glyph(e.kind, 'sm')}</span>`).join('');
  return `<div class="rrow rfold" id="rf-${it.from}" style="--tint:${REALMS[realmOf(l)].tint}">
    <div class="l"><div class="yrs">Years ${it.from}–${it.to}</div><div class="seals">${seals}</div></div>
    <div class="c"></div>
    <div class="r"><div class="sum">${f.text}</div><button class="linkish" data-unfold="${it.from}">Unfold ▾</button></div>
  </div>`;
}
function riverHTML(D, opts = {}) {
  let out = `<div class="river-legend"><div>What ${D.L.name} became</div><div></div><div>What happened</div></div>`;
  for (const it of D.items.slice().reverse()) {
    if (it.fold && !isOpenFold(it)) { out += riverFoldRow(D, it); continue; }
    if (it.fold) {
      out += `<div class="unfold-top"><button class="linkish" data-fold="${it.from}">Fold years ${it.from}–${it.to} ▴</button></div>`;
      for (let y = it.to; y >= it.from; y--) out += riverYearRow(D, y, opts) + riverSeasonRows(D, y, opts);
      continue;
    }
    out += riverYearRow(D, it.y, opts) + riverSeasonRows(D, it.y, opts);
  }
  return out;
}

// ===================== the almanac =====================
function cellHTML(D, y, s) {
  const all = D.ev.filter((e) => e.y === y && e.s === s);
  const es = all.filter(shows);
  const stN = S.settled === 'count' && !S.off.has('settled') ? all.filter((e) => e.kind === 'settled').length : 0;
  const cls = [all.some((e) => e.realm) ? 'realm' : es.some((e) => e.kind === 'qi') ? 'rise' : '', S.sel === `${y}-${s}` ? 'sel' : ''].join(' ');
  return `<td class="cell ${cls}" data-cell="${y}-${s}" style="${sc(s)}" title="${cap(SEASONS[s])} of the ${ordinal(y)} year">
    <div class="pips">${es.map((e) => glyph(e.kind, `sm ${e.kind === 'settled' ? 'dim' : ''}`)).join('')}${stN ? `<span class="more">+${stN}</span>` : ''}</div></td>`;
}
function almanacRows(D, opts = {}) {
  let out = '';
  for (const it of D.items.slice().reverse()) {
    const years = it.fold && isOpenFold(it) ? Array.from({ length: it.to - it.from + 1 }, (_, i) => it.to - i) : it.fold ? [] : [it.y];
    if (it.fold && !isOpenFold(it)) {
      const f = foldSummary(D, it);
      const seals = f.es.filter((e) => e.kind !== 'settled' && shows(e)).map((e) => glyph(e.kind, 'sm')).join('');
      out += `<tr class="afold" id="af-${it.from}"><td class="yr">${it.from}–${it.to}</td><td class="span" colspan="4" data-unfold="${it.from}"><span class="t">${f.text}</span><span class="seals">${seals}</span></td><td class="end">${levelWords(D.at((it.to - 1) * 4 + 3).qi)}</td></tr>`;
      continue;
    }
    if (it.fold) out += `<tr><td></td><td colspan="4" style="text-align:center"><button class="linkish" data-fold="${it.from}">Fold years ${it.from}–${it.to} ▴</button></td><td></td></tr>`;
    for (const y of years) {
      const l = D.at((y - 1) * 4 + 3);
      const yrCell = opts.expand
        ? `<td class="yr yr-click" data-expand="${y}">${y}<span class="caret">${S.open.has(y) ? '▾' : '▸'}</span></td>`
        : `<td class="yr">${y}</td>`;
      out += `<tr id="ay-${y}">${yrCell}${[0, 1, 2, 3].map((s) => cellHTML(D, y, s)).join('')}<td class="end">${y === 1 ? 'born' : levelWords(l.qi)}${l.body ? `<br>body ${ordinal(l.body)}${l.soul ? ` · soul ${ordinal(l.soul)}` : ''}` : ''}</td></tr>`;
      if (opts.expand && S.open.has(y)) {
        out += `<tr class="expand-row"><td colspan="6"><div class="inner">${riverYearRow(D, y)}${riverSeasonRows(D, y)}</div></td></tr>`;
      }
    }
  }
  return out;
}
function almanacTable(D, opts = {}) {
  return `<table class="almanac"><tr><th class="yr"></th>${SEASONS.map((s, i) => `<th style="${sc(i)}"><span class="brush">${SEASON_HZ[i]}</span>${s}</th>`).join('')}<th class="end">By year’s end</th></tr>${almanacRows(D, opts)}</table>`;
}
function readoutHTML(D, opts = {}) {
  if (!S.sel) return `<h4>Pick a season</h4><p class="caption">Each square is a season and each mark a line. Squares edged in crack light hold a breakthrough; the jade one, a new realm.</p>`;
  const [y, s] = S.sel.split('-').map(Number);
  const es = D.ev.filter((e) => e.y === y && e.s === s && (shows(e) || e.kind === 'settled'));
  return `<h4>${cap(SEASONS[s])} of the ${ordinal(y)} year</h4><div class="caption">${D.L.name} at ${y}</div>
    ${es.length ? es.map((e) => `<div class="ln">${glyph(e.kind, e.kind === 'settled' ? 'dim' : '')}<span>${esc(e.text)}</span></div>`).join('') : '<p class="caption">A quiet season.</p>'}
    <div class="after"><span>After it: ${levelWords(D.at((y - 1) * 4 + s).qi)}</span>${opts.toRiver ? `<button class="linkish" data-to-river="${y}-${s}">Read it in the river →</button>` : ''}</div>`;
}

// ===================== mini almanacs =====================
function square(D, y, s) {
  const all = D.ev.filter((e) => e.y === y && e.s === s && !S.off.has(e.kind));
  const k = strongest(all);
  if (!k) return `<span class="sq" data-go="${y}-${s}" title="${cap(SEASONS[s])} of the ${ordinal(y)} year: nothing"></span>`;
  if (k === 'realm') return `<span class="sq realm" data-go="${y}-${s}" title="${REALMS[1].name}"></span>`;
  if (k === 'settled') return `<span class="sq settledonly" data-go="${y}-${s}" title="Settled itself"></span>`;
  return `<span class="sq on" data-go="${y}-${s}" style="--kc:var(--k-${k})" title="${cap(SEASONS[s])} of the ${ordinal(y)} year: ${all.map((e) => KIND[e.kind][1].toLowerCase()).join(', ')}"></span>`;
}
function stripHTML(D) {
  let cols = `<div class="sdots">${SEASON_HZ.map((h, i) => `<span style="color:var(--s-${SEASONS[i]})">${h}</span>`).join('')}</div>`;
  for (const it of D.items) {
    if (it.fold && !isOpenFold(it)) { cols += `<div class="fcol" data-unfold="${it.from}" title="Years ${it.from}–${it.to}: unfold">${it.from}–${it.to}</div>`; continue; }
    const ys = it.fold ? Array.from({ length: it.to - it.from + 1 }, (_, i) => it.from + i) : [it.y];
    for (const y of ys) cols += `<div class="col">${[0, 1, 2, 3].map((s) => square(D, y, s)).join('')}<span class="lab">${y % 5 === 0 || y === 1 || y === D.L.now ? y : ''}</span></div>`;
  }
  return `<div class="strip-wrap"><div class="strip" id="strip">${cols}</div>
    <div class="strip-key"><span>One column a year, oldest at the left; each square is a season, colored by its strongest line.</span><span>Click to go there in the river.</span></div></div>`;
}
function dockHTML(D) {
  let rows = `<div class="dhead"><span></span>${SEASON_HZ.map((h, i) => `<span style="color:var(--s-${SEASONS[i]});text-align:center">${h}</span>`).join('')}</div>`;
  for (const it of D.items.slice().reverse()) {
    if (it.fold && !isOpenFold(it)) { rows += `<div class="dfold" data-unfold="${it.from}" data-dock-y="${it.to}">${it.from}–${it.to}</div>`; continue; }
    const ys = it.fold ? Array.from({ length: it.to - it.from + 1 }, (_, i) => it.to - i) : [it.y];
    for (const y of ys) rows += `<div class="drow" data-dock-y="${y}"><span>${y}</span>${[0, 1, 2, 3].map((s) => square(D, y, s)).join('')}</div>`;
  }
  return `<nav class="dock" aria-label="The almanac">${rows}</nav>`;
}

// ===================== the variants =====================
function chipsHTML() {
  const ks = Object.keys(KIND).filter((k) => !['origin', 'death', 'system'].includes(k) && (k !== 'settled' || S.settled === 'kind'));
  return `<div class="chips">${ks.map((k) => `<button class="chip" data-chip="${k}" aria-pressed="${!S.off.has(k)}">${glyph(k)}${KIND[k][1]}</button>`).join('')}</div>`;
}
function headHTML(D, title, extra = '') {
  return `<div class="panel-head"><h3>${title}</h3><div class="head-right">${extra}
    <select id="life-pick" aria-label="Which life">${Object.entries(LIVES).map(([id, l]) => `<option value="${id}" ${S.life === id ? 'selected' : ''}>${l.label}</option>`).join('')}</select></div></div>`;
}
const VARIANTS = {
  toggle: {
    note: `<b>1 · Two views, linked.</b> One screen, a switch in the header like People's Circles and web. The river is the default; the almanac is the overview. An almanac square reads out on the right with <i>Read it in the river →</i>; each river year has <i>in the almanac</i>. Quiet stretches fold in both; the life picker sits in the header.`,
    render(D) {
      const sw = `<div class="seg" role="group" aria-label="View"><button data-view="river" aria-pressed="${S.view === 'river'}">River</button><button data-view="almanac" aria-pressed="${S.view === 'almanac'}">Almanac</button></div>`;
      const body = S.view === 'river'
        ? riverHTML(D, { toAlmanac: true })
        : `<div class="alm-wrap">${almanacTable(D)}<div class="readout panel">${readoutHTML(D, { toRiver: true })}</div></div>`;
      return headHTML(D, `The life of ${D.L.name}`, sw) + chipsHTML() + body;
    },
  },
  strip: {
    note: `<b>2 · Almanac strip over the river.</b> The almanac turned on its side as a strip of season squares, one column a year, pinned to the top of the panel while the river scrolls under it. Each square takes the color of its strongest line (a realm beats a layer beats a hurt…). Click a square to jump; folded stretches are dashed columns.`,
    render(D) { return headHTML(D, `The life of ${D.L.name}`) + chipsHTML() + stripHTML(D) + riverHTML(D); },
  },
  dock: {
    note: `<b>3 · Almanac docked beside.</b> The river with a narrow almanac down its right edge, newest at the top like the river. It follows your scroll (the years in view are marked) and a click jumps there. The almanac becomes the river's scrollbar. On a phone the dock hides and it is just the river.`,
    render(D) { return headHTML(D, `The life of ${D.L.name}`) + chipsHTML() + `<div class="dock-wrap"><div>${riverHTML(D)}</div>${dockHTML(D)}</div>`; },
  },
  unfold: {
    note: `<b>4 · Almanac that opens into the river.</b> The almanac is the screen. Click a year's number and that year opens in place as a stretch of river, with its two banks and its seasons; open as many as you like. The newest year starts open. Overview first, detail where you are.`,
    render(D) { return headHTML(D, `The almanac of ${D.L.name}`) + chipsHTML() + almanacTable(D, { expand: true }); },
  },
  seals: {
    note: `<b>5 · Year seals on the river.</b> No separate almanac: each year's marker on the river becomes a small four-square seal, spring to winter, with the strongest line of each season in brush (a jade 基 for a new realm). Scroll and the seals give the almanac's glance; the lines under each seal give the river's detail.`,
    render(D) { return headHTML(D, `The life of ${D.L.name}`) + chipsHTML() + riverHTML(D, { seals: true }); },
  },
};

// ===================== render and wiring =====================
const panel = document.getElementById('panel');
function render(after) {
  document.documentElement.classList.toggle('phone', S.size === 'phone');
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.variant === S.variant));
  document.querySelectorAll('#knob-settled button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.settled));
  document.querySelectorAll('#knob-size button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.size));
  document.getElementById('note').innerHTML = VARIANTS[S.variant].note;
  const D = lifeData();
  panel.innerHTML = VARIANTS[S.variant].render(D);
  context(D);
  wire(D);
  save();
  after?.();
}
function context(D) {
  const recent = D.ev.slice().reverse().filter((e) => e.kind !== 'settled').slice(0, 6);
  document.getElementById('context').innerHTML = '<h3>Chronicle</h3>' + recent.map((e) => `<div class="ln">${glyph(e.kind, 'sm')}<span>${esc(e.text)}</span></div>`).join('');
}
function flashTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function ensureUnfolded(D, y) { const f = foldOf(D, y); if (f) S.unfolded.add(`${S.life}:${f.from}`); }
function goRiver(D, y, s) {
  ensureUnfolded(D, y);
  S.view = 'river';
  render(() => {
    let target = `r-${y}-${s}`;
    if (!document.getElementById(target)) target = `ry-${y}`;
    flashTo(target);
  });
}
function wire(D) {
  panel.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => { S.view = b.dataset.view; render(); });
  panel.querySelectorAll('[data-chip]').forEach((b) => b.onclick = () => { const k = b.dataset.chip; S.off.has(k) ? S.off.delete(k) : S.off.add(k); render(); });
  panel.querySelectorAll('[data-unfold]').forEach((b) => b.onclick = () => { S.unfolded.add(`${S.life}:${b.dataset.unfold}`); render(); });
  panel.querySelectorAll('[data-fold]').forEach((b) => b.onclick = () => { S.unfolded.delete(`${S.life}:${b.dataset.fold}`); render(); });
  panel.querySelectorAll('[data-cell]').forEach((td) => td.onclick = () => {
    S.sel = td.dataset.cell;
    if (S.variant === 'unfold') { const y = +S.sel.split('-')[0]; S.open.add(y); render(() => flashTo(`r-${S.sel}`)); } else render();
  });
  panel.querySelectorAll('[data-to-river]').forEach((b) => b.onclick = () => { const [y, s] = b.dataset.toRiver.split('-').map(Number); goRiver(D, y, s); });
  panel.querySelectorAll('[data-to-almanac]').forEach((b) => b.onclick = () => {
    const y = +b.dataset.toAlmanac;
    const s = [3, 2, 1, 0].find((q) => D.ev.some((e) => e.y === y && e.s === q)) ?? 3;
    S.view = 'almanac'; S.sel = `${y}-${s}`; render(() => flashTo(`ay-${y}`));
  });
  panel.querySelectorAll('[data-go]').forEach((q) => q.onclick = () => { const [y, s] = q.dataset.go.split('-').map(Number); goRiver(D, y, s); });
  panel.querySelectorAll('[data-expand]').forEach((td) => td.onclick = () => { const y = +td.dataset.expand; S.open.has(y) ? S.open.delete(y) : S.open.add(y); render(); });
  const pick = panel.querySelector('#life-pick');
  if (pick) pick.onchange = () => { S.life = pick.value; S.sel = `${LIVES[S.life].now}-3`; S.open = new Set([LIVES[S.life].now]); render(); };
  // the strip opens on its newest column
  const strip = panel.querySelector('#strip');
  if (strip) strip.scrollLeft = strip.scrollWidth;
  // the dock follows the scroll
  if (S.variant === 'dock') spy();
}
function spy() {
  const rows = [...panel.querySelectorAll('[data-dock-y]')];
  let inview = new Set();
  const marks = [...panel.querySelectorAll('.ryear, .rfold')];
  marks.forEach((m) => {
    const r = m.getBoundingClientRect();
    if (r.bottom > 60 && r.top < innerHeight) inview.add(m.id.startsWith('ry-') ? +m.id.slice(3) : +m.id.slice(3));
  });
  // a season row in view also marks its year
  panel.querySelectorAll('.rrow[id^="r-"]').forEach((m) => { const r = m.getBoundingClientRect(); if (r.bottom > 60 && r.top < innerHeight) inview.add(+m.id.split('-')[1]); });
  rows.forEach((d) => d.classList.toggle('inview', inview.has(+d.dataset.dockY)));
}
addEventListener('scroll', () => { if (S.variant === 'dock') spy(); }, { passive: true });

document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { S.variant = t.dataset.variant; render(); });
document.querySelectorAll('#knob-settled button').forEach((b) => b.onclick = () => { S.settled = b.dataset.v; S.off.delete('settled'); render(); });
document.querySelectorAll('#knob-size button').forEach((b) => b.onclick = () => { S.size = b.dataset.v; render(); });
try { if (!localStorage.getItem('river-almanac') && matchMedia('(max-width: 700px)').matches) S.size = 'phone'; } catch {}
S.sel = `${LIVES[S.life].now}-0`;
S.open.add(LIVES[S.life].now);
if (!VARIANTS[S.variant]) S.variant = 'toggle';
render();
</script>
</body>
</html>
