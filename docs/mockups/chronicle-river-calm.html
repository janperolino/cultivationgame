<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calmer River</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<style>
:root {
  --void: #040507;
  --edge: rgb(255 255 255 / 0.075);
  --edge-strong: rgb(255 255 255 / 0.14);
  --text: #e9e5da;
  --muted: #8d949d;
  --faint: #5c636c;
  --accent: #d6ab4c;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --crack: #7fc7d9;
  --obsidian: rgb(7 8 11 / 0.96);
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-brush: 'Ma Shan Zheng', 'KaiTi', serif;
  --font-ui: Inter, system-ui, 'Segoe UI', sans-serif;
  --radius: 9px;
  --k-qi: #7fc7d9;  --k-body: #c98a5f;  --k-soul: #a28fdc;  --k-gate: #c4a3f0;
  --k-mastery: #cf7f9f;  --k-learn: #a9b97f;  --k-fight: #ee9670;  --k-hurt: #e08a6a;
  --k-people: #86d19a;  --k-card: #b9b3a6;  --k-settled: #6b727b;  --k-origin: #e4e7ee;
  --k-death: #9aa0a8;  --k-system: #8d949d;  --k-realm: #8fd3b8;
  --s-spring: #86d19a; --s-summer: #e8a874; --s-autumn: #dcb359; --s-winter: #7fc7d9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--void); color: var(--text); font: 14px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font: inherit; color: inherit; }
select { font: inherit; color: var(--text); background: #0b0d11; border: 1px solid var(--edge-strong); border-radius: 7px; padding: 4px 8px; }

.study-bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 20px; background: rgb(4 5 7 / 0.94); border-bottom: 1px solid var(--edge); backdrop-filter: blur(6px); }
.study-bar h1 { font: 600 19px var(--font-display); margin: 0 6px 0 0; white-space: nowrap; }
.study-bar h1 small { font: 15px var(--font-brush); color: var(--accent); margin-left: 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { background: none; border: 1px solid var(--edge); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13px; }
.tab[aria-selected="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.knobs { display: flex; gap: 10px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--edge-strong); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.seg button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.study-note { max-width: 1360px; margin: 12px auto 0; padding: 0 20px; color: var(--muted); font-size: 13px; }
.study-note b { color: var(--text); font-weight: 500; }

.shell { display: grid; grid-template-columns: 180px minmax(0, 1fr) 230px; max-width: 1360px; margin: 12px auto 60px; min-height: 760px; border: 1px solid var(--edge); border-radius: 12px; overflow: clip; background: radial-gradient(900px 500px at 70% 110%, rgb(127 199 217 / 0.05), transparent 60%), var(--void); }
.menu { padding: 18px 10px; border-right: 1px solid var(--edge); background: rgb(4 5 7 / .7); }
.menu .brand { font: 600 16px var(--font-display); padding: 0 8px 14px; white-space: nowrap; }
.menu .brand span { font: 14px var(--font-brush); color: var(--accent); margin-left: 4px; }
.menu a { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 13.5px; margin-bottom: 2px; }
.menu a span { font-family: var(--font-brush); opacity: .7; }
.menu a.on { color: var(--text); background: rgb(255 255 255 / .04); box-shadow: inset 2px 0 0 var(--accent); }
.main { padding: 22px 24px; min-width: 0; }
.main > h2 { font: 600 30px var(--font-display); margin: 0 0 14px; }
.main > h2 span { font: 22px var(--font-brush); color: var(--accent); margin-left: 8px; }
.context { border-left: 1px solid var(--edge); padding: 22px 16px; background: rgb(4 5 7 / .55); font-size: 12.5px; }
.context h3 { font: 600 18px var(--font-display); margin: 0 0 10px; }
.context .ln { display: flex; gap: 7px; margin-bottom: 9px; }
.panel { background: var(--obsidian); border: 1px solid var(--edge-strong); border-radius: var(--radius); box-shadow: 0 0 0 1px rgb(127 199 217 / .06), 0 0 24px rgb(127 199 217 / .05); padding: 18px 20px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.panel-head h3 { font: 600 21px var(--font-display); margin: 0; }
.head-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.caption { color: var(--muted); font-size: 12.5px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; opacity: .85; }
.linkish:hover { text-decoration: underline; opacity: 1; }

.glyph { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 5px; font: 14px/1 var(--font-brush); color: var(--kc); border: 1px solid color-mix(in srgb, var(--kc) 40%, transparent); background: color-mix(in srgb, var(--kc) 9%, transparent); }
.glyph.sm { width: 18px; height: 18px; font-size: 12px; border-radius: 4px; }
.glyph.dim { opacity: .55; }
/* a bare mark: the brush character alone, no box */
.mark { flex: none; display: inline-block; width: 18px; text-align: center; font: 15px/1.3 var(--font-brush); color: var(--kc); }
.mark.dim { opacity: .5; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--edge-strong); border-radius: 999px; padding: 2px 9px 2px 3px; cursor: pointer; font-size: 12px; color: var(--muted); }
.chip .glyph { width: 18px; height: 18px; font-size: 12px; border-radius: 999px; }
.chip[aria-pressed="false"] { opacity: .38; }
.chip[aria-pressed="true"] { color: var(--text); }

/* ================= the river: shared ================= */
.river { position: relative; }
.row { display: grid; scroll-margin: 140px; }
.row .c { position: relative; display: flex; justify-content: center; }
.row .c::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: var(--w, 2px); transform: translateX(-50%); background: var(--tint, var(--crack)); border-radius: 2px; }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@keyframes flash { 0%, 30% { background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); } 100% { background: transparent; box-shadow: none; } }
.fold-row .c::before { background: repeating-linear-gradient(var(--tint, var(--crack)) 0 3px, transparent 3px 8px); opacity: .5; }
.fold-row .r, .fold-row .l { padding: 10px 0; color: var(--muted); font: italic 15px var(--font-display); }

/* seclusion: a stretch of its own, every year a row */
.secl { position: relative; margin: 10px 0; border-radius: 10px; background: linear-gradient(180deg, rgb(255 255 255 / .028), rgb(255 255 255 / .012)); box-shadow: inset 0 0 0 1px var(--edge); padding: 4px 0 6px; }
.secl::after { content: '闭关'; position: absolute; right: 12px; top: 8px; font: 30px/1 var(--font-brush); color: rgb(255 255 255 / .06); pointer-events: none; }
.secl-head, .secl-foot { padding: 8px 14px; color: var(--muted); font-size: 12.5px; }
.secl-head b { font: 600 17px var(--font-display); color: var(--text); margin-right: 8px; }
.secl-foot { font-style: italic; font-family: var(--font-display); font-size: 14px; }
.tick { min-height: 13px; }
.tick .yy { font-size: 10px; color: var(--faint); line-height: 13px; }
.tick .c::before { opacity: .55; }

/* ================= 0 · as before (two banks) ================= */
.st-0 .row { grid-template-columns: 1fr 64px 1fr; min-height: 26px; }
.st-0 .row .l { text-align: right; padding: 3px 14px 3px 0; }
.st-0 .row .r { padding: 3px 0 3px 14px; }
.st-0 .row .c::before { box-shadow: 0 0 calc(var(--w, 2px) * 3) color-mix(in srgb, var(--tint, var(--crack)) 50%, transparent); }
.st-0 .yr .l { align-self: center; font: 600 17px var(--font-display); }
.st-0 .yr .r { align-self: center; color: var(--muted); font-size: 12px; }
.st-0 .age { position: relative; z-index: 1; align-self: center; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 600 15px var(--font-display); background: #090b0f; border: 1px solid var(--edge-strong); box-shadow: 0 0 0 4px var(--void); }
.st-0 .sdot { position: relative; z-index: 1; margin-top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 3px var(--void); }
.st-0 .ln { display: flex; gap: 8px; align-items: flex-start; margin: 2px 0; }
.st-0 .l .ln { flex-direction: row-reverse; }
.st-0 .ln.big { font: 600 16.5px/1.35 var(--font-display); }
.st-0 .ln.big .glyph { width: 28px; height: 28px; font-size: 18px; }
.st-0 .ln.settled { color: var(--faint); font-size: 12.5px; }
.st-0 .sname { font-size: 10.5px; color: var(--sc); text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.st-0 .tick .l { text-align: right; padding-right: 14px; }
.st-0 .realm-row { min-height: 70px; }
.st-0 .realm-row .l { align-self: center; font: 600 18px/1.3 var(--font-display); }
.st-0 .realm-row .r { align-self: center; color: var(--k-realm); font: 600 18px var(--font-display); }

/* ================= A · one bank ================= */
.st-a .row { grid-template-columns: 54px 26px minmax(0, 1fr); }
.st-a .row .c::before { opacity: .75; }
.st-a .row .l { text-align: right; padding-right: 8px; }
.st-a .row .r { padding: 3px 0 3px 10px; }
.st-a .yr { margin-top: 16px; }
.st-a .yr .l { font: 600 20px/1.2 var(--font-display); padding-top: 2px; }
.st-a .yr .r { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding-top: 4px; }
.st-a .yr .r .yn { font: 600 17px var(--font-display); }
.st-a .yr .r .lv { color: var(--muted); font-size: 12px; }
.st-a .node { position: relative; z-index: 1; margin-top: 9px; width: 11px; height: 11px; border-radius: 50%; background: var(--void); border: 2px solid var(--tint, var(--crack)); }
.st-a .ln .r { display: flex; gap: 6px; align-items: flex-start; color: #cfcabf; }
.st-a .ln.big .r { color: var(--text); font: 600 16.5px/1.35 var(--font-display); }
.st-a .ln.big .c::after { content: ''; position: relative; z-index: 1; margin-top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--kc); box-shadow: 0 0 0 3px var(--obsidian), 0 0 8px var(--kc); }
.st-a .ln.settled .r { color: var(--faint); font-size: 12.5px; }
.st-a .sz { font: 13px/1.6 var(--font-brush); color: var(--sc); opacity: .7; padding-top: 3px; }
.st-a .realm-row { margin: 10px 0; }
.st-a .realm-row .c::after { content: '筑基'; position: relative; z-index: 1; align-self: center; writing-mode: vertical-rl; font: 14px/1 var(--font-brush); color: #08100e; background: var(--k-realm); padding: 5px 3px; border-radius: 4px; box-shadow: 0 0 14px rgb(143 211 184 / .5); }
.st-a .realm-row .r { padding: 8px 0 8px 10px; }
.st-a .realm-row .r b { display: block; font: 600 19px var(--font-display); color: var(--k-realm); }

/* ================= B · stations ================= */
.st-b .row { grid-template-columns: 60px 40px minmax(0, 1fr); }
.st-b .row .c::before { width: 3px; opacity: .8; }
.st-b .row .l { text-align: right; padding-right: 8px; color: var(--muted); font-size: 12px; }
.st-b .row .r { padding-left: 10px; }
.st-b .yr .l { font: 600 15px var(--font-display); color: var(--text); padding-top: 7px; }
.st-b .yr .r { color: var(--faint); font-size: 11.5px; padding-top: 9px; }
.st-b .yr .c::after { content: ''; position: relative; z-index: 1; margin-top: 12px; width: 12px; height: 2px; background: var(--edge-strong); }
.st-b .station { margin: 3px 0; }
.st-b .station .c .stop { position: relative; z-index: 1; align-self: center; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 17px/1 var(--font-brush); color: var(--kc); background: #090b0f; border: 2px solid var(--kc); box-shadow: 0 0 0 4px var(--obsidian), 0 0 12px color-mix(in srgb, var(--kc) 35%, transparent); }
.st-b .station .r { align-self: center; font: 600 17px/1.3 var(--font-display); }
.st-b .station .l { align-self: center; }
.st-b .aside .r { padding: 2px 0 6px 10px; }
.st-b .aside ul { list-style: none; margin: 0; padding: 0; }
.st-b .aside li { display: flex; gap: 6px; color: var(--muted); font-size: 13px; padding: 1px 0; }
.st-b .aside li.settled { color: var(--faint); font-size: 12px; }
.st-b .realm-row { margin: 8px 0; }
.st-b .realm-row .stop { width: 46px !important; height: 46px !important; border-radius: 10px !important; font-size: 17px !important; color: var(--k-realm) !important; border-color: var(--k-realm) !important; box-shadow: 0 0 0 4px var(--obsidian), 0 0 20px rgb(143 211 184 / .45) !important; }
.st-b .realm-row .r b { display: block; color: var(--k-realm); font-size: 19px; }

/* ================= C · ink and prose ================= */
.st-c .row { grid-template-columns: 76px 18px minmax(0, 1fr); }
.st-c .row .c::before { width: 1px; background: rgb(233 229 218 / .22); }
.st-c .row .l { text-align: right; padding-right: 10px; }
.st-c .row .r { padding-left: 14px; }
.st-c .yr { margin-top: 22px; }
.st-c .yr .l { font: 26px/1 var(--font-brush); color: rgb(233 229 218 / .16); padding-top: 2px; white-space: nowrap; }
.st-c .yr .r { font: italic 500 20px var(--font-display); color: var(--text); }
.st-c .yr .r small { font: normal 12px var(--font-ui); color: var(--faint); margin-left: 10px; }
.st-c .para .l { font: 12px/1.9 var(--font-brush); color: var(--sc); opacity: .65; }
.st-c .para .r { font: 16px/1.6 var(--font-display); color: #d9d4c8; padding-bottom: 8px; max-width: 64ch; }
.st-c .para .r .m { font: 12px var(--font-brush); color: var(--kc); margin-right: 3px; vertical-align: 1px; }
.st-c .para .r .big { color: var(--text); font-weight: 700; }
.st-c .para .r .settled { color: var(--faint); font-size: 14px; }
.st-c .para .c::after { content: ''; position: relative; z-index: 1; margin-top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--sc); opacity: .6; }
.st-c .realm-row { margin: 16px 0; }
.st-c .realm-row .r { border-top: 1px solid rgb(143 211 184 / .35); border-bottom: 1px solid rgb(143 211 184 / .35); padding: 10px 14px; font: 600 19px var(--font-display); color: var(--k-realm); }
.st-c .realm-row .r span { font: 22px var(--font-brush); margin-right: 10px; }
.st-c .realm-row .r small { display: block; font: 15px var(--font-display); color: #d9d4c8; font-weight: 500; }
.st-c .secl { background: none; box-shadow: none; border-left: 0; }
.st-c .secl::before { content: ''; position: absolute; left: 76px; right: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgb(255 255 255 / .03), transparent 70%); border-radius: 8px; pointer-events: none; }

/* ================= D · milestones first ================= */
.st-d .row { grid-template-columns: 1fr 44px 1fr; min-height: 22px; }
.st-d .row .l { text-align: right; padding: 3px 12px 3px 0; }
.st-d .row .r { padding: 3px 0 3px 12px; }
.st-d .row .c::before { opacity: .8; }
.st-d .yr { margin-top: 10px; }
.st-d .yr .l { font: 600 16px var(--font-display); }
.st-d .yr .r { color: var(--faint); font-size: 11.5px; padding-top: 6px; }
.st-d .yr .c::after { content: ''; position: relative; z-index: 1; margin-top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--void); border: 2px solid var(--tint, var(--crack)); }
.st-d .ln { display: flex; gap: 7px; align-items: flex-start; }
.st-d .l .ln { flex-direction: row-reverse; font: 600 16px/1.35 var(--font-display); }
.st-d .r .ln { color: #cfcabf; }
.st-d .more { color: var(--faint); font-size: 12px; }
.st-d .realm-row .l { font: 600 17px var(--font-display); }
.st-d .realm-row .r { color: var(--k-realm); font: 600 17px var(--font-display); }
.st-d .realm-row .c::after { content: '筑基'; position: relative; z-index: 1; align-self: center; font: 13px/1 var(--font-brush); color: #08100e; background: var(--k-realm); padding: 5px 4px; border-radius: 4px; }

/* ================= the almanac ================= */
.alm-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
.almanac { width: 100%; border-collapse: separate; border-spacing: 4px 3px; table-layout: fixed; }
.almanac th { font: 500 11px var(--font-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.almanac th .brush { font: 16px var(--font-brush); display: block; text-transform: none; letter-spacing: 0; color: var(--sc); }
.almanac .yr { width: 50px; text-align: right; padding-right: 6px; font: 600 15px var(--font-display); }
.almanac .end { width: 150px; color: var(--muted); font-size: 11.5px; line-height: 1.3; padding-left: 6px; }
.almanac tr { scroll-margin: 140px; }
.cell { height: 46px; vertical-align: top; padding: 4px; border-radius: 6px; cursor: pointer; background: color-mix(in srgb, var(--sc) 4%, rgb(255 255 255 / .015)); border: 1px solid var(--edge); }
.cell:hover { border-color: var(--edge-strong); }
.cell.sel { border-color: var(--accent); background: var(--accent-soft); }
.cell.rise { box-shadow: inset 0 0 0 1px rgb(127 199 217 / .45), 0 0 12px rgb(127 199 217 / .16); }
.cell.realm { box-shadow: inset 0 0 0 2px var(--k-realm), 0 0 16px rgb(143 211 184 / .35); }
.cell .pips { display: flex; flex-wrap: wrap; gap: 3px; }
tr.quiet .cell { height: 14px; padding: 0; background: rgb(255 255 255 / .012); }
tr.quiet .yr { font-size: 11px; color: var(--faint); font-family: var(--font-ui); font-weight: 400; }
tr.quiet .end { font-size: 0; }
tr.in-secl td.cell { background: rgb(255 255 255 / .03); border-color: rgb(255 255 255 / .05); }
tr.in-secl td.yr { box-shadow: inset -2px 0 0 rgb(255 255 255 / .14); }
tr.secl-band td.span { padding: 6px 10px; border-radius: 6px; background: rgb(255 255 255 / .03); color: var(--muted); font-size: 12.5px; }
tr.secl-band b { font: 600 15px var(--font-display); color: var(--text); margin-right: 8px; }
tr.secl-band .brush { font: 15px var(--font-brush); color: var(--muted); margin-right: 6px; }
tr.afold td.span { cursor: pointer; border: 1px dashed var(--edge-strong); border-radius: 6px; padding: 6px 10px; color: var(--muted); font: italic 14px var(--font-display); }
.readout { position: sticky; top: 76px; }
.readout h4 { font: 600 19px var(--font-display); margin: 0 0 2px; }
.readout .ln { display: flex; gap: 8px; margin: 8px 0; align-items: flex-start; }
.readout .after { color: var(--muted); font-size: 12px; border-top: 1px solid var(--edge); padding-top: 8px; margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* ================= phone ================= */
.phone .shell { grid-template-columns: minmax(0, 1fr); max-width: 390px; border-radius: 18px; }
.phone .menu, .phone .context { display: none; }
.phone .main { padding: 14px 12px; }
.phone .panel { padding: 12px; }
.phone .st-0 .row { grid-template-columns: 1fr 42px 1fr; }
.phone .st-0 .ln { font-size: 12.5px; } .phone .st-0 .ln.big { font-size: 14px; }
.phone .st-0 .ln.big .glyph { width: 22px; height: 22px; font-size: 14px; }
.phone .st-0 .age { width: 30px; height: 30px; font-size: 13px; }
.phone .st-a .row { grid-template-columns: 34px 20px minmax(0, 1fr); }
.phone .st-a .yr .l { font-size: 16px; }
.phone .st-b .row { grid-template-columns: 34px 36px minmax(0, 1fr); }
.phone .st-b .station .r { font-size: 15px; }
.phone .st-c .row { grid-template-columns: 40px 12px minmax(0, 1fr); }
.phone .st-c .yr .l { font-size: 15px; }
.phone .st-c .para .r { font-size: 15px; }
.phone .st-c .secl::before { left: 40px; }
.phone .st-d .row { grid-template-columns: 1fr 30px 1fr; }
.phone .st-d .l .ln { font-size: 14px; } .phone .st-d .r .ln { font-size: 12.5px; }
.phone .alm-wrap { grid-template-columns: minmax(0, 1fr); }
.phone .almanac .end { display: none; }
.phone .almanac .yr { width: 30px; font-size: 12px; }
.phone .almanac { border-spacing: 2px; }
.phone .cell { height: 40px; padding: 2px; }
.phone .cell .glyph { width: 14px; height: 14px; font-size: 10px; border-radius: 3px; }
.phone .readout { position: static; }

<script>
// ===================== two made-up lives =====================
// [year, season 0-3, kind, text, level]  qi level: 1-9 the layers of Qi Condensation, 10-13 Foundation's four stages
const MO_NING = [
  [1, 0, 'origin', 'Mo Ning is born in the barracks under the Wall of Piled Bones, a conscript’s child.'],
  [12, 0, 'origin', 'The Gate tests Mo Ning’s root: water and metal, a middling pair.'],
  [12, 0, 'learn', 'Mo Ning is taught the Garrison Standard Method at the cadet school.'],
  [12, 1, 'learn', 'Mo Ning drills the Rampart Palm with the cadets of the garrison school.'],
  [12, 1, 'qi', 'Mo Ning’s qi breaks through to the first layer.', 1],
  [12, 2, 'system', 'A first technique to drill: the techniques open.'],
  [12, 2, 'people', 'Mo Ning is posted under Sergeant Gao of the east tower.'],
  [12, 3, 'hurt', 'Mo Ning is clawed below the Wall of Piled Bones on a first night patrol.'],
  [13, 0, 'qi', 'Mo Ning’s qi breaks through to the second layer.', 2],
  [13, 1, 'card', 'Mo Ning pays a ferryman to send two bounty hunters the wrong way.'],
  [13, 1, 'settled', 'A peddler’s offer of cheap pills lapses while Mo Ning sits in seclusion.'],
  [13, 2, 'system', 'Enough insight gathers to grasp a first principle: the trees open.'],
  [13, 2, 'learn', 'Mo Ning comprehends Steady Breath.'],
  [13, 3, 'qi', 'Mo Ning’s qi breaks through to the third layer.', 3],
  [14, 0, 'fight', 'Mo Ning spars with Cadet Lu Wen and brings them down in 7 exchanges.'],
  [14, 0, 'card', 'Mo Ning pays the March’s levy on cultivators.'],
  [14, 0, 'card', 'Mo Ning sits out a stone-hide boar at the cave mouth with his breath held small.'],
  [14, 1, 'body', 'Mo Ning’s body hardens to the first layer.', 1],
  [14, 1, 'settled', 'Sergeant Gao’s errand goes to another cadet while Mo Ning is away.'],
  [14, 3, 'qi', 'Mo Ning’s qi breaks through to the fourth layer.', 4],
  [15, 1, 'hurt', 'Mo Ning is thrown by a qi deviation and left lightly injured.'],
  [15, 2, 'qi', 'Mo Ning’s qi breaks through to the fifth layer.', 5],
  [15, 2, 'mastery', 'The Garrison Standard Method reaches Domain; the breath runs deeper, and understanding with it.'],
  [15, 3, 'learn', 'Mo Ning buys a copy of the Tide-Counting Formula from a stall at the Gate.'],
  [16, 0, 'learn', 'Mo Ning draws a bright orb of qi in from the air of the cave, and the breath after it runs deeper.'],
  [16, 0, 'soul', 'Mo Ning’s soul steadies to the first layer.', 1],
  [16, 1, 'hurt', 'Pill poison settles in Mo Ning’s meridians; for five days the qi will not come.'],
  [16, 1, 'settled', 'A beggar’s tip about a herb patch goes unchased.'],

  [17, 0, 'people', 'Elder Shen of the Clear Heaven Sword Sect watches Mo Ning on the wall and says nothing.'],
  [17, 1, 'fight', 'Mo Ning spars with a Night Bridge runner and is brought down in 3 exchanges.'],
  [17, 2, 'qi', 'Mo Ning’s qi breaks through to the seventh layer.', 7],
  [18, 0, 'settled', 'The levy is paid from Mo Ning’s stones while he sits in seclusion.'],
  [18, 0, 'settled', 'A wandering scribe’s offer to copy a manual lapses.'],
  [18, 1, 'mastery', 'The Rampart Palm reaches Mastery; the form finally clicks.'],
  [18, 3, 'qi', 'Mo Ning’s qi breaks through to the eighth layer.', 8],
  [19, 2, 'settled', 'A thief takes 40 spirit stones from the cave while Mo Ning sits in seclusion.'],
  [20, 1, 'body', 'Mo Ning’s body hardens to the second layer.', 2],
  [20, 3, 'qi', 'Mo Ning’s qi breaks through to the ninth layer.', 9],
  [21, 3, 'mastery', 'The Garrison Standard Method reaches Origin; the breath runs deeper, and understanding with it.'],
  [22, 3, 'gate', 'Qi presses against the gate of Foundation Establishment, but Mo Ning holds no Foundation Pill.'],
  [23, 0, 'card', 'Mo Ning trades two years’ stones and the Rampart Palm’s scroll for a Foundation Pill at the Gate.'],
  [23, 1, 'people', 'Sergeant Gao lends Mo Ning the rest of the price, and tells him not to die.'],
  [23, 2, 'qi', 'Mo Ning swallows the Foundation Pill and breaks through to Foundation Establishment.', 10],
  [24, 0, 'card', 'Mo Ning seals the cave mouth with a stone and goes into seclusion.'],
  [27, 2, 'settled', 'A thief takes 60 spirit stones from the outer cave while Mo Ning sits in seclusion.'],
  [29, 1, 'settled', 'The levy is paid from the cave’s stones.'],
  [31, 3, 'qi', 'Mo Ning’s qi settles into the middle stage of Foundation.', 11],
  [33, 0, 'settled', 'A letter from Sergeant Gao waits at the Gate, unread.'],
  [36, 2, 'body', 'Mo Ning’s body hardens to the third layer.', 3],
  [39, 1, 'qi', 'Mo Ning’s qi settles into the late stage of Foundation.', 12],
  [42, 0, 'card', 'Mo Ning rolls the stone back and walks down to the Gate for the first time in eighteen years.'],
  [42, 0, 'people', 'Sergeant Gao is dead; his widow has kept his sword for Mo Ning.'],
  [42, 1, 'learn', 'Elder Shen teaches Mo Ning the outer form of the Clear Heaven Sword.'],
  [43, 2, 'fight', 'Mo Ning spars with Elder Shen’s disciple Qiu Ran and yields after 12 exchanges.'],
  [44, 3, 'hurt', 'Mo Ning is cut on the reef path by a bounty hunter who took him for someone else.'],
  [45, 1, 'mastery', 'The Clear Heaven Sword’s outer form reaches Proficiency.'],
  [46, 0, 'soul', 'Mo Ning’s soul steadies to the second layer.', 2],
];
const LAN_SHU = [
  [1, 0, 'origin', 'Lan Shu is born on the reef stairs of the lower town.'],
  [9, 2, 'origin', 'The Gate tests Lan Shu’s root: a lone wood root, poor.'],
  [10, 0, 'learn', 'Lan Shu learns the Alley Wind Palm between errands for the bounty office.'],
  [14, 1, 'qi', 'Lan Shu’s qi breaks through to the first layer.', 1],
  [17, 3, 'qi', 'Lan Shu’s qi breaks through to the second layer.', 2],
  [19, 0, 'people', 'Lan Shu falls in with the Night Bridge Society, a favor owed.'],
  [22, 1, 'hurt', 'Lan Shu is knifed in a reef-cave quarrel and limps for a season.'],
  [24, 0, 'card', 'Lan Shu buys a month in a rented meditation cell and stays seven years.'],
  [26, 2, 'qi', 'Lan Shu’s qi breaks through to the third layer.', 3],
  [31, 0, 'card', 'The cell’s owner raises the rent, and Lan Shu walks out into the lower town.'],
  [34, 1, 'settled', 'The levy is paid from Lan Shu’s purse.'],
  [41, 2, 'settled', 'A Night Bridge runner calls in part of the favor; Lan Shu is not home.'],
  [48, 0, 'card', 'Lan Shu sells the Alley Wind Palm’s scroll to feed a sister’s children.'],
  [55, 1, 'settled', 'A peddler’s longevity tea goes unbought.'],
  [63, 3, 'death', 'Lan Shu dies in the sixty-third year at the third layer of Qi Condensation, still owing the Night Bridge Society.'],
];
// seclusions, by the season they began and ended: the game knows these from the seat
const LIVES = {
  now: { name: 'Mo Ning', label: 'This life · Mo Ning, 46', rows: MO_NING, now: 46, secl: [{ from: 24, to: 42, why: 'to settle Foundation' }] },
  before: { name: 'Lan Shu', label: 'The life before · Lan Shu, died at 63', rows: LAN_SHU, now: 63, secl: [{ from: 24, to: 31, why: 'in a rented cell' }] },
};

const KIND = {
  qi: ['气', 'Qi'], body: ['体', 'Body'], soul: ['魂', 'Soul'], gate: ['关', 'Gates'], mastery: ['精', 'Mastery'],
  learn: ['学', 'Learned'], fight: ['战', 'Fights'], hurt: ['伤', 'Hurts'], people: ['人', 'People'], card: ['事', 'Choices'],
  settled: ['了', 'Settled itself'], origin: ['生', 'Birth'], death: ['终', 'Death'], system: ['开', 'Openings'],
};
const BIG = new Set(['qi', 'body', 'soul', 'gate', 'mastery', 'origin', 'death']);
const NOTABLE = new Set([...BIG, 'hurt', 'people']);
const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
const SEASON_HZ = ['春', '夏', '秋', '冬'];
const ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const ORD1 = { one: 'first', two: 'second', three: 'third', five: 'fifth', eight: 'eighth', nine: 'ninth', twelve: 'twelfth' };
const words = (n) => n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
const ordinal = (n) => { const p = words(n).split('-'); const last = p.pop(); return [...p, ORD1[last] ?? (last.endsWith('y') ? last.slice(0, -1) + 'ieth' : last + 'th')].join('-'); };
const HZ = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const hanziNum = (n) => n < 10 ? HZ[n] : n < 20 ? '十' + HZ[n % 10] : HZ[Math.floor(n / 10)] + '十' + HZ[n % 10];
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const sc = (s) => `--sc:var(--s-${SEASONS[s]})`;
const glyph = (k, cls = '') => `<span class="glyph ${cls}" style="--kc:var(--k-${k})" title="${KIND[k][1]}">${KIND[k][0]}</span>`;
const mark = (k) => `<span class="mark ${k === 'settled' ? 'dim' : ''}" style="--kc:var(--k-${k})" title="${KIND[k][1]}">${KIND[k][0]}</span>`;
const STAGE = ['early', 'middle', 'late', 'peak'];
const realmOf = (l) => (l >= 10 ? 1 : 0);
const TINT = ['var(--crack)', 'var(--k-realm)'];
const levelWords = (l) => !l ? 'mortal' : l <= 9 ? `Qi Condensation, ${ordinal(l)} layer` : `Foundation, ${STAGE[l - 10]} stage`;
const spineW = (l) => !l ? 1.5 : l <= 9 ? 2 + 0.7 * l : 2 + 1.6 * (l - 9);

// ===================== state =====================
const S = { style: 'a', life: 'now', view: 'river', size: 'desktop', off: new Set(), unfolded: new Set(), sel: null, more: new Set() };
try { const saved = JSON.parse(localStorage.getItem('river-calm') || 'null'); if (saved) { S.style = saved.style; S.size = saved.size; } else if (matchMedia('(max-width: 700px)').matches) S.size = 'phone'; } catch {}
const save = () => { try { localStorage.setItem('river-calm', JSON.stringify({ style: S.style, size: S.size })); } catch {} };

function lifeData() {
  const L = LIVES[S.life];
  const ev = L.rows.map(([y, s, kind, text, lvl], i) => ({ i, y, s, kind, text, lvl, t: (y - 1) * 4 + s, realm: kind === 'qi' && lvl === 10 }));
  const at = (t) => { const o = { qi: 0, body: 0, soul: 0 }; for (const e of ev) if (e.t <= t && e.lvl !== undefined && o[e.kind] !== undefined) o[e.kind] = e.lvl; return o; };
  const seclOf = (y) => L.secl.find((x) => y >= x.from && y <= x.to);
  // newest first: a seclusion is one stretch with every year in it; other runs of six or more empty years fold
  const items = [];
  let quietRun = [];
  const flush = () => { if (quietRun.length >= 6) items.push({ fold: quietRun.slice() }); else quietRun.forEach((y) => items.push({ y })); quietRun = []; };
  for (let y = L.now; y >= 1; y--) {
    const sx = seclOf(y);
    if (sx) { flush(); if (y === sx.to) items.push({ secl: sx }); continue; }
    if (!ev.some((e) => e.y === y)) quietRun.push(y); else { flush(); items.push({ y }); }
  }
  flush();
  return { L, ev, at, items };
}
const shows = (e) => !S.off.has(e.kind);
const isOpen = (fold) => S.unfolded.has(`${S.life}:${fold.at(-1)}`);

// ===================== river styles =====================
// Each style draws one year (or a quiet year as a tick); seclusions and folds are drawn round them.
const STYLE = {};

STYLE['0'] = {
  note: `<b>0 · As before.</b> The river from the last study, for comparison: two banks, a boxed mark on every line, season names, the age in a circle.`,
  year(D, y) {
    const l = D.at((y - 1) * 4 + 3).qi;
    let out = `<div class="row yr" id="ry-${y}" style="--w:${spineW(l)}px;--tint:${TINT[realmOf(l)]}"><div class="l">${cap(ordinal(y))} year</div><div class="c"><span class="age">${y}</span></div><div class="r">${y === 1 ? 'born' : levelWords(l)} · <button class="linkish" data-to-almanac="${y}">in the almanac</button></div></div>`;
    for (let s = 3; s >= 0; s--) {
      const es = D.ev.filter((e) => e.y === y && e.s === s && shows(e));
      if (!es.length) continue;
      const lv = D.at((y - 1) * 4 + s).qi;
      const realmE = es.find((e) => e.realm);
      const rest = es.filter((e) => !e.realm);
      const L = rest.filter((e) => BIG.has(e.kind)), R = rest.filter((e) => !BIG.has(e.kind));
      const ln = (e) => `<div class="ln ${BIG.has(e.kind) ? 'big' : ''} ${e.kind === 'settled' ? 'settled' : ''}">${glyph(e.kind, e.kind === 'settled' ? 'dim' : '')}<span>${esc(e.text)}</span></div>`;
      const sn = `<div class="sname">${SEASONS[s]}</div>`;
      if (rest.length) out += `<div class="row" id="r-${y}-${s}" style="--w:${spineW(lv)}px;--tint:${TINT[realmOf(lv)]};${sc(s)}"><div class="l">${R.length ? '' : sn}${L.map(ln).join('')}</div><div class="c"><span class="sdot"></span></div><div class="r">${R.length ? sn : ''}${R.map(ln).join('')}</div></div>`;
      if (realmE) out += `<div class="row realm-row" ${rest.length ? '' : `id="r-${y}-${s}"`} style="--w:${spineW(9)}px;--tint:var(--k-realm)"><div class="l">${esc(realmE.text)}</div><div class="c"><span class="age" style="border-color:var(--k-realm);color:var(--k-realm);font-family:var(--font-brush)">基</span></div><div class="r">Foundation Establishment</div></div>`;
    }
    return out;
  },
  tick(D, y) { const l = D.at((y - 1) * 4 + 3).qi; return `<div class="row tick" id="ry-${y}" style="--w:${spineW(l)}px;--tint:${TINT[realmOf(l)]}"><div class="l"><span class="yy">${y}</span></div><div class="c"></div><div class="r"></div></div>`; },
};

STYLE.a = {
  note: `<b>A · One bank.</b> The line runs down the left; every line sits on its right, in the order it happened. The year is a number in the gutter, the season a faint brush character beside its first line. Marks are bare brush characters with no box; a milestone gets a lit bead on the line and the display face, everything else plain text. The line stays thin and widens only a little.`,
  year(D, y) {
    const l = D.at((y - 1) * 4 + 3).qi;
    let out = `<div class="row yr" id="ry-${y}" style="--w:${1.5 + spineW(l) / 4}px;--tint:${TINT[realmOf(l)]}"><div class="l">${y}</div><div class="c"><span class="node"></span></div><div class="r"><span class="yn">${cap(ordinal(y))} year</span><span class="lv">${y === 1 ? 'born' : levelWords(l)}</span><button class="linkish" data-to-almanac="${y}">almanac</button></div></div>`;
    for (let s = 3; s >= 0; s--) {
      const es = D.ev.filter((e) => e.y === y && e.s === s && shows(e));
      const lv = D.at((y - 1) * 4 + s).qi;
      es.forEach((e, j) => {
        if (e.realm) {
          out += `<div class="row realm-row" id="r-${y}-${s}" style="--w:3px;--tint:var(--k-realm)"><div class="l"></div><div class="c"></div><div class="r"><b>Foundation Establishment</b>${esc(e.text)}</div></div>`;
          return;
        }
        out += `<div class="row ln ${BIG.has(e.kind) ? 'big' : ''} ${e.kind === 'settled' ? 'settled' : ''}" ${j === 0 ? `id="r-${y}-${s}"` : ''} style="--w:${1.5 + spineW(lv) / 4}px;--tint:${TINT[realmOf(lv)]};--kc:var(--k-${e.kind});${sc(s)}">
          <div class="l">${j === 0 ? `<span class="sz" title="${SEASONS[s]}">${SEASON_HZ[s]}</span>` : ''}</div><div class="c"></div>
          <div class="r">${mark(e.kind)}<span>${esc(e.text)}</span></div></div>`;
      });
    }
    return out;
  },
  tick(D, y) { const l = D.at((y - 1) * 4 + 3).qi; return `<div class="row tick" id="ry-${y}" style="--w:${1.5 + spineW(l) / 4}px;--tint:${TINT[realmOf(l)]}"><div class="l"><span class="yy">${y}</span></div><div class="c"></div><div class="r"></div></div>`; },
};

STYLE.b = {
  note: `<b>B · Stations.</b> Like a line on a transit map: only the milestones (layers, mastery, gates, birth and death) are stations on the line, each a ringed brush mark with its line in the display face. Everything else that year is a short quiet list under it in small type. Seasons are left to hover. The calmest of the four at a glance; the milestones carry the page.`,
  year(D, y) {
    const l = D.at((y - 1) * 4 + 3).qi;
    const es = D.ev.filter((e) => e.y === y && shows(e)).sort((a, b) => b.t - a.t || b.i - a.i);
    const st = es.filter((e) => BIG.has(e.kind));
    const others = es.filter((e) => !BIG.has(e.kind));
    const w = `--w:3px;--tint:${TINT[realmOf(l)]}`;
    let out = `<div class="row yr" id="ry-${y}" style="${w}"><div class="l">${y}</div><div class="c"></div><div class="r">${cap(ordinal(y))} year · ${y === 1 ? 'born' : levelWords(l)} · <button class="linkish" data-to-almanac="${y}">almanac</button></div></div>`;
    for (const e of st) {
      const lv = D.at(e.t).qi;
      if (e.realm) { out += `<div class="row station realm-row" id="r-${e.y}-${e.s}" style="--w:3px;--tint:var(--k-realm)"><div class="l"></div><div class="c"><span class="stop">筑基</span></div><div class="r"><b>Foundation Establishment</b>${esc(e.text)}</div></div>`; continue; }
      out += `<div class="row station" id="r-${e.y}-${e.s}" style="--w:3px;--tint:${TINT[realmOf(lv)]}" title="${cap(SEASONS[e.s])}"><div class="l"></div><div class="c"><span class="stop" style="--kc:var(--k-${e.kind})">${KIND[e.kind][0]}</span></div><div class="r">${esc(e.text)}</div></div>`;
    }
    if (others.length) {
      out += `<div class="row aside" ${st.length ? '' : `id="r-${y}-${others[0].s}"`} style="${w}"><div class="l"></div><div class="c"></div><div class="r"><ul>${others.map((e) => `<li class="${e.kind === 'settled' ? 'settled' : ''}" title="${cap(SEASONS[e.s])}">${mark(e.kind)}<span>${esc(e.text)}</span></li>`).join('')}</ul></div></div>`;
    }
    return out;
  },
  tick(D, y) { const l = D.at((y - 1) * 4 + 3).qi; return `<div class="row tick" id="ry-${y}" style="--w:3px;--tint:${TINT[realmOf(l)]}"><div class="l"><span class="yy">${y}</span></div><div class="c"></div><div class="r"></div></div>`; },
};

STYLE.c = {
  note: `<b>C · Ink and prose.</b> A thin ink line and no glow. Each year opens with its number in faint brush (二十二) and an italic heading; each season is one paragraph, its lines run together as prose, each led by a small colored mark. Milestones go bold in the text instead of getting their own bank. Reads most like the biography the design asks for.`,
  year(D, y) {
    const l = D.at((y - 1) * 4 + 3).qi;
    let out = `<div class="row yr" id="ry-${y}"><div class="l">${hanziNum(y)}</div><div class="c"></div><div class="r">The ${ordinal(y)} year<small>${y === 1 ? 'born' : levelWords(l)} · <button class="linkish" data-to-almanac="${y}">almanac</button></small></div></div>`;
    for (let s = 3; s >= 0; s--) {
      const es = D.ev.filter((e) => e.y === y && e.s === s && shows(e));
      if (!es.length) continue;
      const realmE = es.find((e) => e.realm);
      const rest = es.filter((e) => !e.realm);
      if (rest.length) {
        const text = rest.map((e) => `<span class="${BIG.has(e.kind) ? 'big' : ''} ${e.kind === 'settled' ? 'settled' : ''}"><span class="m" style="--kc:var(--k-${e.kind})" title="${KIND[e.kind][1]}">${KIND[e.kind][0]}</span>${esc(e.text)}</span>`).join(' ');
        out += `<div class="row para" id="r-${y}-${s}" style="${sc(s)}"><div class="l" title="${SEASONS[s]}">${SEASON_HZ[s]}</div><div class="c"></div><div class="r">${text}</div></div>`;
      }
      if (realmE) out += `<div class="row realm-row" ${rest.length ? '' : `id="r-${y}-${s}"`}><div class="l"></div><div class="c"></div><div class="r"><span>筑基</span>Foundation Establishment<small>${esc(realmE.text)}</small></div></div>`;
    }
    return out;
  },
  tick(D, y) { return `<div class="row tick" id="ry-${y}"><div class="l"><span class="yy">${y}</span></div><div class="c"></div><div class="r"></div></div>`; },
};

STYLE.d = {
  note: `<b>D · Milestones first.</b> The two banks kept, but quieter: no boxes, no season names, no age circle, and each year shows only what mattered most (breakthroughs, hurts, people). The rest waits behind "+ 3 more this year". The closest to what you had, with the noise turned down.`,
  year(D, y) {
    const l = D.at((y - 1) * 4 + 3).qi;
    const es = D.ev.filter((e) => e.y === y && shows(e)).sort((a, b) => b.t - a.t || b.i - a.i);
    const open = S.more.has(`${S.life}:${y}`);
    const shown = open ? es : es.filter((e) => NOTABLE.has(e.kind));
    const hidden = es.length - shown.length;
    const w = `--w:${1.5 + spineW(l) / 3}px;--tint:${TINT[realmOf(l)]}`;
    let out = `<div class="row yr" id="ry-${y}" style="${w}"><div class="l">${cap(ordinal(y))} year</div><div class="c"></div><div class="r">${y === 1 ? 'born' : levelWords(l)} · <button class="linkish" data-to-almanac="${y}">almanac</button></div></div>`;
    for (const e of shown) {
      const lv = D.at(e.t).qi;
      if (e.realm) { out += `<div class="row realm-row" id="r-${e.y}-${e.s}" style="--w:3px;--tint:var(--k-realm)"><div class="l">${esc(e.text)}</div><div class="c"></div><div class="r">Foundation Establishment</div></div>`; continue; }
      const left = BIG.has(e.kind);
      const ln = `<div class="ln">${mark(e.kind)}<span>${esc(e.text)}</span></div>`;
      out += `<div class="row" id="r-${e.y}-${e.s}" style="--w:${1.5 + spineW(lv) / 3}px;--tint:${TINT[realmOf(lv)]}" title="${cap(SEASONS[e.s])}"><div class="l">${left ? ln : ''}</div><div class="c"></div><div class="r">${left ? '' : ln}</div></div>`;
    }
    if (hidden > 0 || open) out += `<div class="row" style="${w}"><div class="l"></div><div class="c"></div><div class="r"><button class="linkish more" data-more="${y}" style="color:var(--muted)">${open ? 'Fewer ▴' : `+ ${hidden} more this year`}</button></div></div>`;
    return out;
  },
  tick(D, y) { const l = D.at((y - 1) * 4 + 3).qi; return `<div class="row tick" id="ry-${y}" style="--w:${1.5 + spineW(l) / 3}px;--tint:${TINT[realmOf(l)]}"><div class="l"><span class="yy">${y}</span></div><div class="c"></div><div class="r"></div></div>`; },
};

function seclDesc(D, sx) {
  const es = D.ev.filter((e) => e.y > sx.from && e.y < sx.to);
  const qi = es.filter((e) => e.kind === 'qi').length, bo = es.filter((e) => e.kind === 'body').length;
  const parts = [];
  if (qi) parts.push(`${qi === 1 ? 'a stage' : `${words(qi)} stages`} of qi`);
  if (bo) parts.push(`${bo === 1 ? 'a body layer' : `${words(bo)} body layers`}`);
  return `${cap(words(sx.to - sx.from))} years ${sx.why}${parts.length ? `: ${parts.join(', ')}` : ''}`;
}
function riverHTML(D) {
  const st = STYLE[S.style];
  const yearOrTick = (y) => D.ev.some((e) => e.y === y && shows(e)) ? st.year(D, y) : st.tick(D, y);
  let out = '';
  for (const it of D.items) {
    if (it.secl) {
      const sx = it.secl;
      let inner = '';
      for (let y = sx.to; y >= sx.from; y--) inner += yearOrTick(y);
      out += `<div class="secl" id="secl-${sx.from}"><div class="secl-head"><b>In seclusion</b>the ${ordinal(sx.from)} to the ${ordinal(sx.to)} year · ${seclDesc(D, sx)}</div>${inner}</div>`;
      continue;
    }
    if (it.fold) {
      if (isOpen(it.fold)) { out += `<div style="text-align:center;margin:4px 0"><button class="linkish" data-fold="${it.fold.at(-1)}">Fold years ${it.fold.at(-1)}–${it.fold[0]} ▴</button></div>`; it.fold.forEach((y) => { out += st.tick(D, y); }); continue; }
      const l = D.at((it.fold[0] - 1) * 4 + 3).qi;
      out += `<div class="row fold-row" style="--tint:${TINT[realmOf(l)]};${S.style === '0' || S.style === 'd' ? '' : ''}"><div class="l"></div><div class="c"></div><div class="r">${cap(words(it.fold.length))} years with nothing written, the ${ordinal(it.fold.at(-1))} to the ${ordinal(it.fold[0])} · <button class="linkish" data-unfold="${it.fold.at(-1)}" style="font-style:normal">unfold</button></div></div>`;
      continue;
    }
    out += st.year(D, it.y);
  }
  return `<div class="river st-${S.style}">${out}</div>`;
}

// ===================== the almanac =====================
function almanacHTML(D) {
  let rows = '';
  const yearRow = (y, inSecl) => {
    const all = D.ev.filter((e) => e.y === y && shows(e));
    const l = D.at((y - 1) * 4 + 3);
    const quiet = !all.length;
    const cells = [0, 1, 2, 3].map((s) => {
      const es = all.filter((e) => e.s === s);
      const cls = [es.some((e) => e.realm) ? 'realm' : es.some((e) => e.kind === 'qi') ? 'rise' : '', S.sel === `${y}-${s}` ? 'sel' : ''].join(' ');
      return `<td class="cell ${cls}" data-cell="${y}-${s}" style="${sc(s)}" title="${cap(SEASONS[s])} of the ${ordinal(y)} year"><div class="pips">${es.map((e) => glyph(e.kind, `sm ${e.kind === 'settled' ? 'dim' : ''}`)).join('')}</div></td>`;
    }).join('');
    return `<tr id="ay-${y}" class="${quiet ? 'quiet' : ''} ${inSecl ? 'in-secl' : ''}"><td class="yr">${y}</td>${cells}<td class="end">${y === 1 ? 'born' : levelWords(l.qi)}${l.body ? `<br>body ${ordinal(l.body)}${l.soul ? ` · soul ${ordinal(l.soul)}` : ''}` : ''}</td></tr>`;
  };
  for (const it of D.items) {
    if (it.secl) {
      const sx = it.secl;
      rows += `<tr class="secl-band"><td></td><td class="span" colspan="4"><span class="brush">闭关</span><b>In seclusion</b>${seclDesc(D, sx)}</td><td></td></tr>`;
      for (let y = sx.to; y >= sx.from; y--) rows += yearRow(y, true);
      continue;
    }
    if (it.fold) {
      if (isOpen(it.fold)) { it.fold.forEach((y) => { rows += yearRow(y, false); }); continue; }
      rows += `<tr class="afold"><td class="yr" style="font-size:11px">${it.fold.at(-1)}–${it.fold[0]}</td><td class="span" colspan="4" data-unfold="${it.fold.at(-1)}">${cap(words(it.fold.length))} years with nothing written</td><td></td></tr>`;
      continue;
    }
    rows += yearRow(it.y, false);
  }
  let readout = `<h4>Pick a season</h4>`;
  if (S.sel) {
    const [y, s] = S.sel.split('-').map(Number);
    const es = D.ev.filter((e) => e.y === y && e.s === s && shows(e));
    readout = `<h4>${cap(SEASONS[s])} of the ${ordinal(y)} year</h4><div class="caption">${D.L.name} at ${y}</div>
      ${es.length ? es.map((e) => `<div class="ln">${glyph(e.kind, e.kind === 'settled' ? 'dim' : '')}<span>${esc(e.text)}</span></div>`).join('') : '<p class="caption">A quiet season.</p>'}
      <div class="after"><span>After it: ${levelWords(D.at((y - 1) * 4 + s).qi)}</span><button class="linkish" data-to-river="${y}-${s}">Read it in the river →</button></div>`;
  }
  return `<div class="alm-wrap"><table class="almanac"><tr><th class="yr"></th>${SEASONS.map((s, i) => `<th style="${sc(i)}"><span class="brush">${SEASON_HZ[i]}</span>${s}</th>`).join('')}<th class="end">By year’s end</th></tr>${rows}</table><div class="readout panel">${readout}</div></div>`;
}

// ===================== render and wiring =====================
const panel = document.getElementById('panel');
function render(after) {
  document.documentElement.classList.toggle('phone', S.size === 'phone');
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.style === S.style));
  document.querySelectorAll('#knob-size button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.size));
  document.getElementById('note').innerHTML = STYLE[S.style].note + ` <span>All five: a seclusion is its own stretch, every year in it a row (quiet ones as thin ticks); only long runs outside seclusion with nothing at all still fold.</span>`;
  const D = lifeData();
  const ks = Object.keys(KIND).filter((k) => !['origin', 'death', 'system'].includes(k));
  panel.innerHTML = `<div class="panel-head"><h3>The life of ${D.L.name}</h3><div class="head-right">
      <div class="seg" role="group" aria-label="View"><button data-view="river" aria-pressed="${S.view === 'river'}">River</button><button data-view="almanac" aria-pressed="${S.view === 'almanac'}">Almanac</button></div>
      <select id="life-pick" aria-label="Which life">${Object.entries(LIVES).map(([id, l]) => `<option value="${id}" ${S.life === id ? 'selected' : ''}>${l.label}</option>`).join('')}</select></div></div>
    <div class="chips">${ks.map((k) => `<button class="chip" data-chip="${k}" aria-pressed="${!S.off.has(k)}">${glyph(k)}${KIND[k][1]}</button>`).join('')}</div>
    ${S.view === 'river' ? riverHTML(D) : almanacHTML(D)}`;
  document.getElementById('context').innerHTML = '<h3>Chronicle</h3>' + D.ev.slice().reverse().filter((e) => e.kind !== 'settled').slice(0, 6).map((e) => `<div class="ln">${glyph(e.kind, 'sm')}<span>${esc(e.text)}</span></div>`).join('');
  wire(D);
  save();
  after?.();
}
function flashTo(id) { const el = document.getElementById(id); if (!el) return; el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function wire(D) {
  const q = (sel, fn) => panel.querySelectorAll(sel).forEach((el) => el.onclick = () => fn(el));
  q('[data-view]', (b) => { S.view = b.dataset.view; render(); });
  q('[data-chip]', (b) => { const k = b.dataset.chip; S.off.has(k) ? S.off.delete(k) : S.off.add(k); render(); });
  q('[data-unfold]', (b) => { S.unfolded.add(`${S.life}:${b.dataset.unfold}`); render(); });
  q('[data-fold]', (b) => { S.unfolded.delete(`${S.life}:${b.dataset.fold}`); render(); });
  q('[data-more]', (b) => { const k = `${S.life}:${b.dataset.more}`; S.more.has(k) ? S.more.delete(k) : S.more.add(k); render(); });
  q('[data-cell]', (td) => { S.sel = td.dataset.cell; render(); });
  q('[data-to-river]', (b) => {
    const [y, s] = b.dataset.toRiver.split('-').map(Number);
    const f = D.items.find((it) => it.fold && it.fold.includes(y)); if (f) S.unfolded.add(`${S.life}:${f.fold.at(-1)}`);
    S.view = 'river';
    if (S.style === 'd') S.more.add(`${S.life}:${y}`);
    render(() => flashTo(document.getElementById(`r-${y}-${s}`) ? `r-${y}-${s}` : `ry-${y}`));
  });
  q('[data-to-almanac]', (b) => {
    const y = +b.dataset.toAlmanac;
    const s = [3, 2, 1, 0].find((x) => D.ev.some((e) => e.y === y && e.s === x)) ?? 3;
    S.view = 'almanac'; S.sel = `${y}-${s}`; render(() => flashTo(`ay-${y}`));
  });
  const pick = panel.querySelector('#life-pick');
  if (pick) pick.onchange = () => { S.life = pick.value; S.sel = `${LIVES[S.life].now}-3`; render(); };
}
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { S.style = t.dataset.style; render(); });
document.querySelectorAll('#knob-size button').forEach((b) => b.onclick = () => { S.size = b.dataset.v; render(); });
if (!STYLE[S.style]) S.style = 'a';
S.sel = `${LIVES[S.life].now}-0`;
render();
</script>
</body>
</html>
