<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map layout study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  /* A5 study, redone on the real map in A5.1: the Map laid out like Cultivate and Routine. The map
     is the scene, full bleed, with no panels or hairlines round it; the controls float over it on
     still scrims. The map is the ground study (map-ground-study.html?embed): the painted Border
     Wilds, its tiles, the fog and a sample save, and it pans and zooms. Four takes on the same
     content, with or without a card waiting. Runs through the dev server. */
  :root {
    --bg: #040507; --text: #e9e5da; --muted: #8d949d; --accent: #d6ab4c; --gilt: #d9b46a;
    --line: rgb(217 180 106 / 0.4); --line-faint: rgb(217 180 106 / 0.16); --crack: #7fc7d9; --warn: #e08a6a;
    --travel: #c2ae8c; --look: #9fc4ad; --sleep: #59606b; --qi: #7fc7d9;
    --display: 'Cormorant Garamond', Georgia, serif; --ui: Inter, system-ui, sans-serif; --brush: 'Ma Shan Zheng', 'KaiTi', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--text); font-family: var(--ui); overflow-x: hidden; }
  /* The study's own controls float over the stage, so the stage has the whole window; H hides them. */
  .bar-top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 14px; font-size: 13px; color: var(--muted); background: rgb(4 5 7 / .9); border-bottom: 1px solid var(--line-faint); }
  .bar-top.hidden { display: none; }
  .show-bar { position: fixed; top: 6px; right: 10px; z-index: 10; display: none; background: rgb(4 5 7 / .8); border: 1px solid var(--line-faint); color: var(--muted); padding: 3px 10px; font: 12px var(--ui); border-radius: 3px; cursor: pointer; }
  .show-bar.on { display: block; }
  .bar-top b { color: var(--text); font-weight: 500; }
  .bar-top button { background: none; border: 1px solid var(--line-faint); color: var(--muted); padding: 4px 11px; font: inherit; border-radius: 3px; cursor: pointer; }
  .bar-top button.on { color: var(--accent); border-color: var(--line); }
  .wrap { width: 100%; height: 100vh; overflow: clip; }
  .stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }

  /* The scene: the map, full bleed, fading into the void and the fog at its edges. */
  .map { position: absolute; inset: 0 0 0 72px; width: calc(100% - 72px); height: 100%; border: 0; display: block; background: var(--bg); }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui .block, #ui .rail, #ui .top { pointer-events: auto; }
  .scrim { position: absolute; pointer-events: none; }
  .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 72px; background: rgb(4 5 7 / .94); border-right: 1px solid var(--line-faint); display: flex; flex-direction: column; align-items: center; padding-top: 22px; gap: 26px; }
  .rail i { width: 20px; height: 20px; border: 1.4px solid rgb(233 229 218 / .35); border-radius: 4px; }
  .rail i.on { border-color: var(--accent); box-shadow: 0 0 0 5px rgb(214 171 76 / .1); }
  .rail i:first-child { border-radius: 50%; border-color: var(--gilt); }

  /* The top floats over the map, as on Cultivate. */
  .top { position: absolute; top: 22px; left: 104px; right: 40px; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-family: var(--display); font-size: 22px; }
  .brand .hz { font-size: 18px; margin-left: 6px; }
  .res { display: flex; gap: 22px; align-items: baseline; text-align: right; }
  .res b { font-family: var(--display); font-weight: 500; font-size: 20px; display: block; }
  .res small { font-size: 11px; color: var(--muted); }

  /* Pieces shared by the takes. */
  .hz { font-family: var(--brush); color: var(--gilt); }
  .cap { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .chips { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-faint); border-radius: 3px; overflow: hidden; }
  .chips span { padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .chips span + span { border-left: 1px solid var(--line-faint); }
  .chips span.on { color: var(--accent); background: rgb(214 171 76 / .12); }
  .chips span.off { opacity: .4; }
  .where b { font-family: var(--display); font-weight: 500; font-size: 19px; }
  .where div { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .where .pip { color: var(--accent); }
  .zoom { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .zoom span { display: grid; place-items: center; min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid var(--line-faint); border-radius: 3px; background: rgb(4 5 7 / .6); color: var(--muted); font-size: 13px; }

  .course h2 { font-family: var(--display); font-weight: 500; font-size: 28px; margin: 4px 0 8px; }
  .course h2 .hz { font-size: 21px; margin-left: 6px; }
  .bar { height: 2px; background: rgb(255 255 255 / .08); margin: 4px 0 12px; }
  .bar i { display: block; height: 100%; width: 84%; background: linear-gradient(to right, var(--gilt), var(--accent)); }
  .kv { display: grid; grid-template-columns: 70px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .ahead { list-style: none; margin: 0; padding: 0; }
  .ahead li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid rgb(255 255 255 / .05); }
  .ahead li .seal { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 3px; font-family: var(--brush); color: var(--gilt); font-size: 14px; }
  .ahead li .r { margin-left: auto; font-size: 12px; color: var(--muted); }
  .ahead li.wait .r { color: var(--accent); }
  .ahead li.wait { color: var(--text); }

  .enc h3 { font-family: var(--display); font-weight: 500; font-size: 25px; margin: 0; }
  .enc .sub { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .enc p { font-family: var(--display); font-style: italic; font-size: 17px; margin: 0 0 10px; color: #d9d4c7; }
  .enc .who { display: grid; grid-template-columns: 1fr auto; font-size: 13px; gap: 3px 10px; margin-bottom: 10px; }
  .enc .who span:nth-child(even) { color: var(--muted); }
  .enc .stake { font-size: 13px; margin-bottom: 10px; }
  .enc .stake b { color: var(--accent); font-weight: 500; margin-right: 4px; }
  .choice { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-top: 4px; border-radius: 3px; background: rgb(255 255 255 / .03); }
  .choice:first-of-type { background: rgb(214 171 76 / .1); box-shadow: inset 0 0 0 1px var(--line); }
  .choice b { font-weight: 500; font-size: 14px; display: block; }
  .choice small { font-size: 12px; color: var(--muted); }
  .choice .v { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 9px; border: 1px solid var(--line-faint); color: var(--muted); }
  .choice .v.short { color: var(--warn); border-color: rgb(224 138 106 / .4); }
  .choice .v.sure { color: var(--look); }
  .foot { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--accent); }

  .road { display: flex; gap: 22px; align-items: center; }
  .road .lines { display: grid; gap: 9px; font-size: 13px; }
  .road .now { font-size: 14px; }
  .road .now .hz { margin-right: 6px; }
  .wheel { flex: none; }

  .block { position: absolute; }
  .gl { padding: 16px 20px; }

  /* E to I. */
  .fold { display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 18px; font-size: 13px; border: 1px solid var(--line-faint); border-radius: 3px; background: rgb(4 5 7 / .6); }
  .fold .r { margin-left: auto; color: var(--accent); font-size: 12px; }
  .rib-h { font-family: var(--display); font-weight: 500; font-size: 24px; margin: 2px 0 6px; display: flex; align-items: baseline; gap: 8px; }
  .rib-h .hz { font-size: 19px; }
  .rib-n { margin-left: auto; font-family: var(--ui); font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line-faint); }
  .tabs span { padding: 7px 12px; font-size: 13px; color: var(--muted); border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
  .tabs span.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs i { font-style: normal; color: var(--accent); font-size: 9px; vertical-align: 2px; }

  /* M to O: the game's .panel (theme.css), and its waiting rim on the card. */
  .pnl { padding: 20px 22px; border: 1px solid var(--line-faint); border-radius: 4px; background: rgb(7 8 11 / .84); box-shadow: 0 24px 50px -28px rgb(0 0 0 / .95); }
  .pnl.waits { border-color: rgb(214 171 76 / .45); box-shadow: 0 24px 50px -28px rgb(0 0 0 / .95), 0 0 24px -8px rgb(214 171 76 / .35); }
  .pnl-rule { height: 1px; background: var(--line-faint); margin: 14px 0; }
  .pnl .course h2 { font-size: 24px; margin-top: 2px; }

  /* P: Routine's tabs (theme.css .seg, .routine-tabs, .menu-mark). */
  .stage { --shade: .85; }
  .seg { display: inline-flex; border: 1px solid rgb(217 180 106 / .28); border-radius: 7px; overflow: hidden; margin: 18px 0 18px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; font: 14px var(--ui); cursor: pointer; }
  .seg button + button { border-left: 1px solid rgb(217 180 106 / .28); }
  .seg button.on { background: rgb(214 171 76 / .12); color: var(--accent); }
  .mark { display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); vertical-align: middle; }
  .ptab[hidden] { display: none; }
  .pcol .course h2 { font-size: 24px; }
  .pcol .enc .who { grid-template-columns: 1fr; gap: 1px; }
  .pcol .enc .who span:nth-child(even) { margin-bottom: 4px; }

  /* Day/hide toggles. */
  [data-show="road"] .if-card { display: none !important; }
  [data-show="card"] .if-road { display: none !important; }
</style>
</head>
<body>
<div class="bar-top">
  <b>Take</b>
  <button data-v="A">A · Cultivate's band</button>
  <button data-v="B">B · Routine's column</button>
  <button data-v="C">C · corners, the most map</button>
  <button data-v="D">D · two wings</button>
  <button data-v="E">E · column left</button>
  <button data-v="F">F · one column holds it all</button>
  <button data-v="G">G · ribbon on top</button>
  <button data-v="H">H · card in the middle</button>
  <button data-v="I">I · a narrow book</button>
  <button data-v="J">J · all left, road on top</button>
  <button data-v="K">K · all left, road at the foot</button>
  <button data-v="L">L · all left, split in two</button>
  <button data-v="M">M · two panels, stacked</button>
  <button data-v="N">N · two panels, side by side</button>
  <button data-v="O">O · journey along the foot</button>
  <button data-v="P">P · one place, tabs</button>
  <b style="margin-left:18px">P's shade</b>
  <button data-shade=".95">darker</button>
  <button data-shade=".85" class="on">dark</button>
  <button data-shade=".6">light</button>
  <button data-shade=".35">faint</button>
  <button data-shade="0">none</button>
  <b style="margin-left:18px">State</b>
  <button data-s="card" class="on">a card waits</button>
  <button data-s="road">on the road</button>
  <b style="margin-left:18px">Sample save</b>
  <button data-sample="arrived">just arrived</button>
  <button data-sample="map">bought a map</button>
  <button data-sample="region" class="on">whole region sketched</button>
  <button data-sample="far">explored further</button>
  <b style="margin-left:18px">Map brightness</b>
  <button data-b="1">1×</button>
  <button data-b="1.25">1.25×</button>
  <button data-b="1.5" class="on">1.5×</button>
  <button data-b="1.75">1.75×</button>
  <button data-b="2">2×</button>
  <span style="margin-left:auto">Drag and scroll the map. No place pieces yet.</span>
  <button id="hide-bar">Hide (H)</button>
</div>
<button class="show-bar" id="show-bar">Controls (H)</button>
<div class="wrap"><div class="stage" id="stage" data-show="card"><iframe class="map" id="map" title="The Border Wilds"></iframe><div id="ui"></div></div></div>

<template id="t-wheel">
  <svg class="wheel" viewBox="-60 -60 120 120" width="SIZE" height="SIZE">
    <g id="segs"></g>
    <circle r="31" fill="#07080b" stroke="rgb(217 180 106 / .5)" stroke-width="1"/>
    <circle r="57" fill="none" stroke="rgb(217 180 106 / .55)" stroke-width="1.2"/>
    <circle r="54" fill="none" stroke="rgb(217 180 106 / .18)" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="20" y2="-14" stroke="#d9b46a" stroke-width="1.6" stroke-linecap="round"/>
    <circle r="3" fill="#d9b46a"/>
  </svg>
</template>

<script>
const H = '子丑寅卯辰巳午未申酉戌亥';
const kinds = ['sleep','sleep','look','travel','travel','travel','travel','travel','travel','travel','sleep','sleep'];
const col = { sleep: '#59606b', look: '#9fc4ad', travel: '#c2ae8c' };
function wheel(size) {
  let segs = '';
  for (let i = 0; i < 12; i++) {
    const a0 = (i / 12) * Math.PI * 2 - Math.PI / 2 - Math.PI / 12, a1 = a0 + Math.PI * 2 / 12;
    const p = (r, a) => `${(r * Math.cos(a)).toFixed(2)} ${(r * Math.sin(a)).toFixed(2)}`;
    const c = col[kinds[i]];
    segs += `<path d="M${p(33, a0)} L${p(52, a0)} A52 52 0 0 1 ${p(52, a1)} L${p(33, a1)} A33 33 0 0 0 ${p(33, a0)}Z" fill="${c}" fill-opacity="${i === 8 ? .55 : .26}" stroke="#040507" stroke-width="1"/>`;
    const am = (a0 + a1) / 2;
    segs += `<text x="${(42.5 * Math.cos(am)).toFixed(2)}" y="${(42.5 * Math.sin(am) + 3).toFixed(2)}" text-anchor="middle" font-family="Ma Shan Zheng, KaiTi" font-size="9" fill="${i === 8 ? '#fff1c9' : 'rgb(233 229 218 / .7)'}">${H[i]}</text>`;
  }
  return document.getElementById('t-wheel').innerHTML.replace(/SIZE/g, size).replace('<g id="segs"></g>', segs);
}

let where = '';
const zoom = `<div class="zoom"><span>+</span><span>−</span><span>Region</span><span>You</span></div>`;
const routine = `<div class="cap">Road routine</div>
  <div class="chips"><span>By day</span><span>Pressed march</span><span class="on">Night road</span><span>My road 1</span></div>`;
const now = `<div class="now"><span class="hz">申</span>camped: a card waits for you</div>
  <div class="muted" style="font-size:12px">160 li a day, 40 a double-hour · tap an hour to set it in Routine</div>`;
const going = `<div class="cap">Going by</div>
  <div class="chips"><span class="on">Light step</span><span class="off">Horse</span><span class="off">Mount</span><span class="off">Passage</span><span class="off">Fly</span><span class="off">Someone's sword</span></div>`;
const stance = `<div class="cap">When the road brings something</div>
  <div class="chips"><span>Avoid</span><span class="on">Careful</span><span>Bold</span></div>
  <div class="muted" style="font-size:12px;max-width:430px">Hunts the sure kills and takes clear sneaks and flights; gathers finds. Anything else waits for you.</div>`;
let course = '';
let courseRoad = '';
const ahead = `<div class="cap" style="margin-top:14px">Ahead</div><ul class="ahead">
  <li class="wait if-card"><span class="seal">修</span>Deserters in the pines<span class="r">waiting</span></li>
  <li><span class="seal">人</span>A post rider of the Jing<span class="r">3 h</span></li></ul>`;
const enc = `<div class="enc"><h3>Deserters in the pines</h3><div class="sub">cultivator · it waits for you</div>
  <p>Three men in cut-off garrison coats step out of the blackpines across the trail, spears low.</p>
  <div class="who"><span>a garrison deserter, the one talking</span><span>Qi Condensation, fifth layer</span><span>2 more deserters</span><span>Qi Condensation, second layer</span></div>
  <div class="stake"><b>Win</b>what they carry · <b class="warn">Short</b>a wound, 30% for 10 days, half your stones and a thing from the bag</div>
  <div class="choice"><div><b>Run for it · your stance</b><small>Speed against theirs</small></div><span class="v">clear</span></div>
  <div class="choice"><div><b>Pay the road toll they ask</b><small>It costs 12 low-grade stones.</small></div><span class="v sure">sure</span></div>
  <div class="choice"><div><b>Threaten them off</b><small>your presence against their nerve</small></div><span class="v">clear</span></div>
  <div class="choice"><div><b>Fight them</b><small>you'd fall before they do: 15 exchanges to fell them, 9 to fell you</small></div><span class="v short">short</span></div>
  <div class="foot"><span>Stop here</span><span>Turn back home</span></div></div>`;

const shell = `<div class="rail"><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="top"><div class="brand">Severed Heaven<span class="hz">断天</span></div>
  <div class="res"><div><b>Spring 3,177</b><small>申 · afternoon</small></div><div><b>9</b><small>low-grade</small></div><div><b>3,315</b><small>insight</small></div></div></div>`;

/** The line under the date and the course card, from the sample save the map shows. */
let info = null;
function fill(m) {
  info = m;
  const w = m.where;
  where = `<div class="where"><b>Spring 3,177</b>
  <div>${w.place} · ${w.terrain} · ${w.qi} · you see ${w.sight} li</div>
  <div><span class="pip">${w.pips}</span> ${w.depth}</div></div>`;
  const c = m.course;
  const days = Math.max(1, Math.round(c.li / 160));
  const head = `<div class="course"><div class="cap">On the road</div>
  <h2>To ${c.name}<span class="hz">${c.hanzi}</span></h2>
  <div class="bar"><i></i></div>`;
  course = `${head}<dl class="kv"><dt>Left</dt><dd>${c.li.toLocaleString()} li · ${days} day${days > 1 ? 's' : ''} · on the road</dd>
  <dt>Arrives</dt><dd>when you go on</dd>
  <dt>Now</dt><dd class="warn">Stopped: a card waits for you. You camp and cultivate where you stand.</dd></dl></div>`;
  courseRoad = `${head}<dl class="kv"><dt>Left</dt><dd>${c.li.toLocaleString()} li · ${days} day${days > 1 ? 's' : ''} · on the road</dd>
  <dt>Arrives</dt><dd>Spring 3,177, day ${12 + days} · about ${days * 10} s</dd>
  <dt>Now</dt><dd>Travelling by day, open.</dd></dl></div>`;
}

const takes = {
  // A: Cultivate's band. A thin fading band across the foot: the road left, the course or the card
  // in the middle, what's ahead right. The map takes everything above it.
  A: () => `${shell}
    <div class="scrim" style="left:72px;right:0;bottom:0;height:430px;background:linear-gradient(to top, rgb(4 5 7 / .96) 0%, rgb(4 5 7 / .88) 55%, rgb(4 5 7 / .5) 80%, transparent)"></div>
    <div class="scrim" style="left:72px;top:0;width:760px;height:220px;background:radial-gradient(ellipse at 0 0, rgb(4 5 7 / .8), transparent 70%)"></div>
    <div class="block" style="left:110px;top:80px">${where}</div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>
    <div class="block road" style="left:110px;bottom:40px;width:620px;align-items:flex-end">${wheel(200)}<div class="lines">${routine}${now}${going}${stance}</div></div>
    <div class="block if-card" style="left:770px;bottom:30px;width:640px">${enc}</div>
    <div class="block if-road" style="left:770px;bottom:60px;width:560px">${courseRoad}</div>
    <div class="block" style="left:1460px;bottom:40px;width:400px"><div class="if-card">${course.replace('<h2>', '<h2 style="font-size:22px">')}</div>${ahead}</div>`,

  // B: Routine's column. Everything you read and choose in one column on the right, fading in
  // from the edge; the wheel low left in its bezel. The column is where P3.9's scene would play.
  B: () => `${shell}
    <div class="scrim" style="right:0;top:0;bottom:0;width:820px;background:linear-gradient(to left, rgb(4 5 7 / .95) 0%, rgb(4 5 7 / .88) 60%, rgb(4 5 7 / .4) 85%, transparent)"></div>
    <div class="scrim" style="left:72px;bottom:0;width:820px;height:380px;background:radial-gradient(ellipse at 0 100%, rgb(4 5 7 / .9), transparent 70%)"></div>
    <div class="scrim" style="left:72px;top:0;width:760px;height:220px;background:radial-gradient(ellipse at 0 0, rgb(4 5 7 / .8), transparent 70%)"></div>
    <div class="block" style="left:110px;top:80px">${where}</div>
    <div class="block" style="left:110px;bottom:40px;display:flex;gap:22px;align-items:flex-end">${wheel(220)}<div class="lines road" style="display:grid;gap:9px">${routine}${now}${going}${stance}</div></div>
    <div class="block" style="right:56px;top:96px;width:600px">${'<div class="if-card">' + course + '</div><div class="if-road">' + courseRoad + '</div>'}${ahead}<div class="if-card" style="margin-top:18px">${enc}</div></div>
    <div class="block" style="right:676px;top:96px">${zoom}</div>`,

  // C: Corners. The most map: where you stand top left, the road low left, the course top right,
  // and the card only when one waits, low and centred like Cultivate's open card.
  C: () => `${shell}
    <div class="scrim" style="left:72px;top:0;width:760px;height:220px;background:radial-gradient(ellipse at 0 0, rgb(4 5 7 / .8), transparent 70%)"></div>

  D: () => `${shell}

    <div class="scrim" style="right:0;top:0;bottom:0;width:760px;background:linear-gradient(to left, rgb(4 5 7 / .95) 0%, rgb(4 5 7 / .85) 60%, transparent)"></div>

    <div class="block" style="left:50%;bottom:36px;transform:translateX(-50%)"><div class="zoom" style="flex-direction:row">${zoom.replace('<div class="zoom">', '').replace('</div>', '')}</div></div>`,

  // E: B mirrored. The column on the left, beside the rail, where the eye starts; the road low
  // right; the map takes the right of the screen.
  E: () => `${shell}
    <div class="scrim" style="left:72px;top:0;bottom:0;width:820px;background:linear-gradient(to right, rgb(4 5 7 / .95) 0%, rgb(4 5 7 / .88) 60%, rgb(4 5 7 / .4) 85%, transparent)"></div>
    <div class="scrim" style="right:0;bottom:0;width:820px;height:380px;background:radial-gradient(ellipse at 100% 100%, rgb(4 5 7 / .9), transparent 70%)"></div>
    <div class="block" style="left:110px;top:80px;width:600px">${where}<div style="height:26px"></div>${'<div class="if-card">' + course + '</div><div class="if-road">' + courseRoad + '</div>'}${ahead}<div class="if-card" style="margin-top:18px">${enc}</div></div>
    <div class="block road" style="right:40px;bottom:40px;flex-direction:row-reverse;align-items:flex-end">${wheel(220)}<div class="lines" style="text-align:right;justify-items:end">${routine}${now}${going}${stance}</div></div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,

  // F: One column holds it all. The road sits in the column too, so the map is whole to the
  // column's edge; with a card waiting the road folds to one line, since the card is what matters.
  F: () => `${shell}
    <div class="scrim" style="right:0;top:0;bottom:0;width:760px;background:linear-gradient(to left, rgb(4 5 7 / .96) 0%, rgb(4 5 7 / .9) 66%, rgb(4 5 7 / .4) 88%, transparent)"></div>
    <div class="scrim" style="left:72px;top:0;width:760px;height:220px;background:radial-gradient(ellipse at 0 0, rgb(4 5 7 / .8), transparent 70%)"></div>
    <div class="block" style="left:110px;top:80px">${where}</div>
    <div class="block" style="right:56px;top:96px;width:580px">
      <div class="if-road" style="display:flex;gap:20px;align-items:center;margin-bottom:22px">${wheel(170)}<div class="lines road" style="display:grid;gap:9px">${routine}${now}${going}</div></div>
      <div class="if-card fold"><span class="hz">申</span> Night road · Light step · Careful<span class="r">the road ▸</span></div>
      ${'<div class="if-card">' + course + '</div><div class="if-road">' + courseRoad + '</div>'}${ahead}<div class="if-card" style="margin-top:18px">${enc}</div></div>
    <div class="block" style="right:676px;top:96px">${zoom}</div>`,

  // G: A ribbon on top. Where you stand and the course run as one strip across the top; the road
  // is a small dock low left; a card opens as a drawer on the right only when one waits, so on
  // the road the map has the whole screen under the ribbon.
  G: () => `${shell}
    <div class="scrim" style="left:72px;right:0;top:0;height:230px;background:linear-gradient(to bottom, rgb(4 5 7 / .95) 0%, rgb(4 5 7 / .85) 55%, transparent)"></div>
    <div class="scrim" style="left:72px;bottom:0;width:700px;height:300px;background:radial-gradient(ellipse at 0 100%, rgb(4 5 7 / .9), transparent 70%)"></div>
    <div class="scrim if-card" style="right:0;top:0;bottom:0;width:740px;background:linear-gradient(to left, rgb(4 5 7 / .96) 0%, rgb(4 5 7 / .9) 66%, transparent)"></div>
    <div class="block" style="left:110px;top:80px">${where}</div>
    <div class="block ribbon" style="left:640px;top:84px;width:500px">
      <div class="cap">On the road</div>
      <div class="rib-h">To ${info.course.name}<span class="hz">${info.course.hanzi}</span><span class="rib-n">${info.course.li.toLocaleString()} li · ${Math.max(1, Math.round(info.course.li / 160))} days</span></div>
      <div class="bar"><i></i></div>
      <div class="if-card warn" style="font-size:13px">Stopped: a card waits for you.</div><div class="if-road muted" style="font-size:13px">Travelling by day, open · arrives in about ${Math.max(1, Math.round(info.course.li / 160)) * 10} s</div></div>
    <div class="block if-road" style="right:56px;top:84px;width:380px">${ahead}</div>
    <div class="block road" style="left:110px;bottom:36px">${wheel(150)}<div class="lines">${routine}${now}</div></div>
    <div class="block if-card" style="right:56px;top:250px;width:600px">${ahead}<div style="margin-top:18px">${enc}</div></div>
    <div class="block" style="right:56px;bottom:40px">${zoom.replace('class="zoom"', 'class="zoom" style="flex-direction:row"')}</div>`,

  // H: The card in the middle. The map is whole; a card that waits stands at the middle of the
  // screen like Cultivate's open card, the map dimmed round it, the road and course small in
  // the corners until you answer it.
  H: () => `${shell}
    <div class="scrim" style="left:72px;top:0;width:760px;height:220px;background:radial-gradient(ellipse at 0 0, rgb(4 5 7 / .8), transparent 70%)"></div>
    <div class="scrim" style="left:72px;bottom:0;width:700px;height:320px;background:radial-gradient(ellipse at 0 100%, rgb(4 5 7 / .92), transparent 70%)"></div>
    <div class="scrim" style="right:0;bottom:0;width:640px;height:360px;background:radial-gradient(ellipse at 100% 100%, rgb(4 5 7 / .92), transparent 70%)"></div>
    <div class="scrim if-card" style="left:72px;right:0;top:0;bottom:0;background:radial-gradient(ellipse 30% 46% at 52% 50%, rgb(4 5 7 / .95) 42%, rgb(4 5 7 / .55) 72%, rgb(4 5 7 / .22) 100%)"></div>
    <div class="block" style="left:110px;top:80px">${where}</div>
    <div class="block road" style="left:110px;bottom:36px">${wheel(160)}<div class="lines">${routine}${now}${going}</div></div>
    <div class="block" style="right:56px;bottom:40px;width:420px">${'<div class="if-card">' + course.replace('<h2>', '<h2 style="font-size:22px">') + '</div><div class="if-road">' + courseRoad.replace('<h2>', '<h2 style="font-size:22px">') + '</div>'}</div>
    <div class="block if-road" style="right:56px;top:96px;width:380px">${ahead}</div>
    <div class="block if-card" style="left:50%;top:50%;width:640px;transform:translate(-50%,-50%) translateX(36px)">${enc}</div>
    <div class="block" style="right:56px;top:96px">${zoom.replace('class="zoom"', 'class="zoom if-card"')}</div>`,

  // I: A narrow book at the side. A slim column on the right with three tabs, the card, the course
  // and the road, one open at a time: the card when one waits, else the course. The wheel lives
  // in the Road tab, so the map is clear everywhere left of the column.
  I: () => `${shell}
    <div class="scrim" style="right:0;top:0;bottom:0;width:620px;background:linear-gradient(to left, rgb(4 5 7 / .97) 0%, rgb(4 5 7 / .92) 72%, transparent)"></div>
    <div class="scrim" style="left:72px;top:0;width:760px;height:220px;background:radial-gradient(ellipse at 0 0, rgb(4 5 7 / .8), transparent 70%)"></div>
    <div class="block" style="left:110px;top:80px">${where}</div>
    <div class="block" style="right:48px;top:96px;width:470px">
      <div class="tabs"><span class="if-card on">Card <i>●</i></span><span class="if-road on">Course</span><span class="if-card">Course</span><span>Road</span><span>Ahead · 2</span></div>
      <div class="if-card">${enc}</div><div class="if-road">${courseRoad}${ahead}</div></div>
    <div class="block" style="right:540px;top:96px">${zoom}</div>
    <div class="block" style="left:110px;bottom:40px"><div class="fold" style="width:400px"><span class="hz">申</span> Night road · Light step · Careful<span class="r">Road tab ▸</span></div></div>`,

  // J: All in one place, on the left (Jan's note after A to I). One column beside the rail holds
  // everything, read top to bottom: where you stand, the road, the course, what's ahead, the card.
  // With a card waiting the road folds to one line; the map has the rest of the screen.
  J: () => `${shell}
    <div class="scrim" style="left:72px;top:0;bottom:0;width:860px;background:linear-gradient(to right, rgb(4 5 7 / .96) 0%, rgb(4 5 7 / .9) 64%, rgb(4 5 7 / .4) 86%, transparent)"></div>
    <div class="block" style="left:110px;top:80px;width:580px">${where}
      <div class="if-road" style="display:flex;gap:20px;align-items:center;margin:26px 0 24px">${wheel(180)}<div class="lines road" style="display:grid;gap:9px">${routine}${now}${going}${stance}</div></div>
      <div class="if-card fold" style="margin-top:22px"><span class="hz">申</span> Night road · Light step · Careful<span class="r">the road ▸</span></div>
      ${'<div class="if-card">' + course + '</div><div class="if-road">' + courseRoad + '</div>'}${ahead}<div class="if-card" style="margin-top:18px">${enc}</div></div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,

  // K: The same column, the road at its foot. Reading runs down from the top (where you stand, the
  // course, what's ahead, the card) and the controls sit together at the bottom, as Routine's do.
  K: () => `${shell}
    <div class="scrim" style="left:72px;top:0;bottom:0;width:720px;background:linear-gradient(to right, rgb(4 5 7 / .9) 0%, rgb(4 5 7 / .82) 78%, rgb(4 5 7 / .35) 92%, transparent)"></div>
    <div class="block" style="left:110px;top:80px;width:580px">${where}<div style="height:22px"></div>
      ${'<div class="if-card">' + course.replace('<h2>', '<h2 style="font-size:24px">').replace(/<dl[\s\S]*<\/dl>/, '') + '</div><div class="if-road">' + courseRoad + '</div>'}${ahead}<div class="if-card" style="margin-top:16px">${enc}</div></div>
    <div class="block road" style="left:110px;bottom:36px">${wheel(190)}<div class="lines">${routine}${now}${going}${stance}</div></div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,

  // L: One wide panel on the left, split in two: the road on its left half, the wheel big; the
  // course, what's ahead and the card on its right half. Nothing folds; the map is narrower.
  L: () => `${shell}
    <div class="scrim" style="left:72px;top:0;bottom:0;width:1160px;background:linear-gradient(to right, rgb(4 5 7 / .96) 0%, rgb(4 5 7 / .9) 72%, rgb(4 5 7 / .4) 90%, transparent)"></div>
    <div class="block" style="left:110px;top:80px;width:320px">${where}
      <div style="margin:34px 0 22px;display:grid;place-items:center">${wheel(250)}</div>
      <div style="display:grid;gap:12px">${routine}${now}${going}${stance}</div></div>
    <div class="block" style="left:470px;top:96px;width:560px">${'<div class="if-card">' + course + '</div><div class="if-road">' + courseRoad + '</div>'}${ahead}<div class="if-card" style="margin-top:18px">${enc}</div></div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,

  // M to O: two panels and no shade (Jan's note after K: the shade framed the map). The game's own
  // panels, obsidian with a gilt hairline, one for the journey (where you stand, the course, what's
  // ahead and the road with its wheel) and one for the card, only while one waits; the map is
  // untouched everywhere else.
  // M: stacked on the left, the journey above, the card under it.
  M: () => `${shell}
    <div class="block pnl" style="left:104px;top:76px;width:580px">${journey()}</div>
    <div class="block pnl waits if-card" style="left:104px;top:600px;width:580px">${enc}</div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,

  // N: side by side at the top left, the card beside the journey.
  N: () => `${shell}
    <div class="block pnl" style="left:104px;top:76px;width:520px">${journey()}</div>
    <div class="block pnl waits if-card" style="left:644px;top:76px;width:580px">${enc}</div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,

  // O: the journey as a strip along the foot (wheel, road, course), the card above it on the left.
  O: () => `${shell}
    <div class="block pnl" style="left:104px;bottom:28px;display:flex;gap:28px;align-items:center">
      ${wheel(180)}
      <div class="lines road" style="display:grid;gap:9px;width:440px">${routine}${now}${going}${stance}</div>
      <div style="width:470px;align-self:stretch;border-left:1px solid var(--line-faint);padding-left:26px">${where}<div style="height:12px"></div><div class="if-card">${courseHead()}</div><div class="if-road">${courseRoad}</div>${ahead}</div></div>
    <div class="block pnl waits if-card" style="left:104px;top:76px;width:580px">${enc}</div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,
};
/** P's open tab: the card when one waits, else the journey; the tabs switch it. */
let ptab = 'card';
Object.assign(takes, {
  // P: one place on the left that shows one thing at a time (Jan's note after M to O), as Routine
  // switches Day, Practice and Study: where you stand always on top, then Routine's tabs, Journey
  // (the wheel, the road, the course, what's ahead) and Card, which shows only while a card waits
  // and opens itself then. Less at once, so the shade behind it is light and tight.
  P: () => `${shell}
    <div class="scrim" style="left:72px;top:0;bottom:0;width:560px;background:linear-gradient(to right, rgb(4 5 7 / var(--shade)) 0%, rgb(4 5 7 / calc(var(--shade) * .92)) 76%, transparent)"></div>
    <div class="block pcol" style="left:96px;top:80px;width:430px">${where}
      <div class="seg ptabs"><button data-tab="journey" class="${ptab === 'journey' ? 'on' : ''}">Journey</button><button data-tab="card" class="if-card ${ptab === 'card' ? 'on' : ''}">Card<i class="mark"></i></button></div>
      <div class="ptab" data-show-tab="journey" ${ptab === 'journey' ? '' : 'hidden'}>
        <div class="road" style="margin-bottom:22px;gap:16px">${wheel(150)}<div class="lines">${routine}${now}${going}${stance}</div></div>
        <div class="if-card">${course}</div><div class="if-road">${courseRoad}</div>${ahead}</div>
      <div class="ptab" data-show-tab="card" ${ptab === 'card' ? '' : 'hidden'}>${enc}</div></div>
    <div class="block" style="right:40px;top:96px">${zoom}</div>`,
});
/** The course card's head only, for while a card waits (the card already says you've stopped). */
const courseHead = () => course.replace(/<dl[\s\S]*<\/dl>/, '');
/** The journey panel of M and N: where you stand, the course, what's ahead, the road and its wheel. */
const journey = () => `${where}<div class="pnl-rule"></div>
  <div class="if-card">${courseHead()}</div><div class="if-road">${courseRoad}</div>${ahead}<div class="pnl-rule"></div>
  <div class="road if-road" style="gap:18px">${wheel(150)}<div class="lines">${routine}${now}${going}${stance.replace(/<div class="muted"[\s\S]*<\/div>$/, '')}</div></div>
  <div class="road if-card" style="gap:16px">${wheel(110)}<div class="lines">${routine}${now}</div></div>`;

/** The part of the map each take leaves open, as insets from the map's edges in stage pixels (left,
    top, right, bottom): what you've charted fits there at the farthest zoom, and the zoom-out stops
    there. Insets, not shares, since the stage's width follows the window. */
const open = {
  A: [55, 108, 55, 432], B: [74, 151, 850, 302], C: [222, 65, 480, 324], D: [640, 54, 760, 86],
  E: [850, 65, 55, 367], F: [74, 151, 740, 54], G: [55, 216, 700, 281], H: [185, 130, 517, 346], I: [74, 151, 590, 86],
  J: [760, 65, 55, 54], K: [690, 65, 55, 54], L: [1040, 65, 55, 54],
  // M to O leave a different part open with a card waiting than on the road.
  M: [600, 65, 55, 54], N: { road: [580, 65, 55, 54], card: [1180, 65, 55, 54] },
  O: { road: [55, 65, 55, 300], card: [640, 65, 55, 300] },
  P: [520, 65, 55, 54],
};
function openShare() {
  const o = open[v];
  const [l, t, r, b] = Array.isArray(o) ? o : o[stage.dataset.show];
  const W = mapFrame.clientWidth;
  return [l / W, t / 1080, 1 - r / W, 1 - b / 1080];
}

const stage = document.getElementById('stage');
const ui = document.getElementById('ui');
const mapFrame = document.getElementById('map');
let v = 'P';
let study = null;
/** The map's lift, picked in the bar. */
let bright = 1.5;
function render() {
  if (!study) return;
  ui.innerHTML = takes[v]();
  place();
  study.frame(openShare());
}
function show(state) {
  stage.dataset.show = state;
  ptab = state === 'card' ? 'card' : 'journey';
  if (v === 'P' && study) ui.innerHTML = takes.P();
  study?.card(state === 'card');
  place();
  if (study && !Array.isArray(open[v])) study.frame(openShare());
}
/** M's card panel sits under the journey panel, whose height changes with the state. */
function place() {
  const j = ui.querySelector('.pnl:not(.waits)');
  const c = ui.querySelector('.pnl.waits');
  if (v === 'M' && j && c) c.style.top = j.offsetTop + j.offsetHeight + 16 + 'px';
}
mapFrame.onload = () => {
  study = mapFrame.contentWindow.mapStudy;
  fill(study);
  show(stage.dataset.show);
  study.bright(bright);
  render();
};
function load(sample) {
  mapFrame.src = 'map-ground-study.html?embed&sample=' + sample;
  document.querySelectorAll('[data-sample]').forEach((x) => x.classList.toggle('on', x.dataset.sample === sample));
}
document.querySelectorAll('[data-v]').forEach((b) => {
  b.classList.toggle('on', b.dataset.v === v);
  b.onclick = () => {
    v = b.dataset.v; document.querySelectorAll('[data-v]').forEach((x) => x.classList.toggle('on', x === b)); render();
  };
});
document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => {
  show(b.dataset.s); document.querySelectorAll('[data-s]').forEach((x) => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-sample]').forEach((b) => b.onclick = () => load(b.dataset.sample));
document.querySelectorAll('[data-shade]').forEach((b) => b.onclick = () => {
  stage.style.setProperty('--shade', b.dataset.shade);
  document.querySelectorAll('[data-shade]').forEach((x) => x.classList.toggle('on', x === b));
});
// P's tabs switch what the column shows.
ui.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  ptab = t.dataset.tab;
  ui.innerHTML = takes.P();
});
document.querySelectorAll('[data-b]').forEach((b) => b.onclick = () => {
  bright = +b.dataset.b; study?.bright(bright);
  document.querySelectorAll('[data-b]').forEach((x) => x.classList.toggle('on', x === b));
});
/** As the game's stage (design § UI and screens, The stage): scaled by the window's height over
    1080, its width following the window, never narrower than 1728. */
function fit() {
  const k = Math.min(window.innerHeight / 1080, window.innerWidth / 1728);
  stage.style.width = window.innerWidth / k + 'px';
  stage.style.transform = `scale(${k})`;
  // The map's canvas takes its new size on its own; frame it again once it has.
  setTimeout(() => study && study.frame(openShare()), 60);
}
window.addEventListener('resize', fit);
const bar = document.querySelector('.bar-top');
const showBar = document.getElementById('show-bar');
function toggleBar() {
  bar.classList.toggle('hidden');
  showBar.classList.toggle('on', bar.classList.contains('hidden'));
}
document.getElementById('hide-bar').onclick = toggleBar;
showBar.onclick = toggleBar;
window.addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') toggleBar(); });
mapFrame.addEventListener('load', () => mapFrame.contentWindow.addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') toggleBar(); }));
fit();
load('region');
</script>
</body>
